syntax = "proto2";
package dmLiveUpdateManifestDDF;

option java_package = "com.dynamo.liveupdate.proto";
option java_outer_classname = "LiveUpdateManifest";

enum RuleOperation {
    ADD = 0;
    REMOVE = 1;
}

message RuleDesc {
    required string name = 1;
    optional RuleOperation operation = 2 [default = ADD];
    optional string path = 3;
    optional string package = 4;
}

message PackageDesc {
    required string name = 1;
    optional string provider = 2 [default = "zip"];
    repeated RuleDesc rules = 3;
}

message ProviderProperty {
    required string name = 1;
    required string value = 2;
}

message ProviderSettings {
    required string provider = 1;
    repeated ProviderProperty properties = 2;
}

message ManifestDesc {
    repeated PackageDesc packages = 1;
    optional string output_directory = 2 [default = "build/packages"];
    repeated ProviderSettings providers = 3;
}
