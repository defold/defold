syntax = "proto2";
package dmGameObjectSourceDDF;

import "ddf/ddf_math.proto";

import "gameobject/gameobject_ddf.proto";
import "gamesys/camera_ddf.proto";
import "gamesys/collectionproxy_ddf.proto";
import "gamesys/data_ddf.proto";
import "gamesys/gamesys_ddf.proto";
import "gamesys/label_ddf.proto";
import "gamesys/mesh_ddf.proto";
import "gamesys/model_ddf.proto";
import "gamesys/physics_ddf.proto";
import "gamesys/sound_ddf.proto";
import "gamesys/sprite_ddf.proto";
import "particle/particle_ddf.proto";

option java_package = "com.dynamo.gameobject.proto";
option java_outer_classname = "GameObjectSource";

// Authoring format for game objects and collections. The engine runtime uses
// dmGameObjectDDF from gameobject_ddf.proto after the build tools have replaced
// embedded source descriptions with ordinary component and instance references.
message EmbeddedComponentDesc
{
    required string id = 1;
    required string type = 2;

    optional dmMath.Point3 position = 3;
    optional dmMath.Quat rotation = 4;
    optional dmMath.Vector3One scale = 5;

    oneof payload
    {
        dmPhysicsDDF.CollisionObjectDesc collisionobject = 6;
        dmGameSystemDDF.LabelDesc label = 7;
        dmGameSystemDDF.SpriteDesc sprite = 8;
        dmSoundDDF.SoundDesc sound = 9;
        dmModelDDF.ModelDesc model = 10;
        dmGameSystemDDF.FactoryDesc factory = 11;
        dmGameSystemDDF.CollectionFactoryDesc collectionfactory = 12;
        dmParticleDDF.ParticleFX particlefx = 13;
        dmGamesysDDF.CameraDesc camera = 14;
        dmCollectionProxyDDF.CollectionProxyDesc collectionproxy = 15;
        dmMeshDDF.MeshDesc mesh = 16;
        // Shared by lights and extension components, whose schemas are not
        // available when this authoring format is generated.
        dmGameSystemDDF.Data component_data = 17;
    }
}

message PrototypeDesc
{
    repeated dmGameObjectDDF.ComponentDesc components = 1;
    repeated EmbeddedComponentDesc embedded_components = 2;
}

message EmbeddedInstanceDesc
{
    required string id = 1;
    repeated string children = 2;

    optional dmMath.Point3 position = 3;
    optional dmMath.Quat rotation = 4;
    repeated dmGameObjectDDF.ComponentPropertyDesc component_properties = 5;
    optional float scale = 6 [default = 1.0];
    optional dmMath.Vector3One scale3 = 7;

    oneof payload
    {
        PrototypeDesc prototype = 8;
    }
}

message CollectionDesc
{
    required string name = 1;
    repeated dmGameObjectDDF.InstanceDesc instances = 2;
    repeated dmGameObjectDDF.CollectionInstanceDesc collection_instances = 3;
    optional uint32 scale_along_z = 4 [default = 0]; // Deprecated
    repeated EmbeddedInstanceDesc embedded_instances = 5;
}
