# Engine trial. Uncrustify 0.83.0.
indent_columns = 4
indent_with_tabs = 0
input_tab_size = 4
output_tab_size = 4
indent_namespace = true
indent_class = true
indent_access_spec = 0
indent_switch_case = 4
indent_case_brace = 0
indent_label = -4
indent_ctor_init = -4
indent_ctor_init_leading = 0
indent_ctor_init_following = 0
indent_constr_colon = true
indent_extern = true
indent_align_paren = true
indent_align_assign = true
indent_continue = 0
code_width = 0
nl_max = 3
nl_fdef_brace = force
nl_if_brace = force
nl_elseif_brace = force
nl_else_brace = force
nl_for_brace = force
nl_while_brace = force
nl_do_brace = force
nl_switch_brace = force
nl_enum_brace = force
nl_struct_brace = force
nl_union_brace = force
nl_class_brace = force
nl_namespace_brace = force
nl_try_brace = force
nl_catch_brace = force
nl_brace_else = force
nl_brace_catch = force
nl_case_colon_brace = force
nl_after_case = true
mod_case_brace = add
mod_move_case_break = true
mod_full_brace_if = add
mod_full_brace_for = add
mod_full_brace_while = add
mod_full_brace_do = add
nl_template_class = force
nl_template_func = force
nl_after_brace_open = true
nl_after_brace_close = true
nl_after_semicolon = true
nl_split_if_one_liner = true
nl_split_for_one_liner = true
nl_split_while_one_liner = true
nl_func_leave_one_liners = false
sp_after_type = add # manual columns
sp_before_ptr_star = remove
sp_between_ptr_star = remove
sp_after_ptr_star = add
sp_before_byref = remove
sp_after_byref = add
sp_assign = add
sp_arith = add
sp_compare = add
sp_bool = add
sp_after_comma = add
sp_before_comma = remove
sp_inside_paren = remove
sp_inside_fparen = remove
sp_inside_sparen = remove
sp_inside_square = remove
sp_inside_angle = remove
sp_template_angle = force
sp_before_sparen = force
sp_func_call_paren = remove
sp_func_def_paren = remove
sp_func_proto_paren = remove
sp_func_class_paren = remove
sp_after_cast = ignore # manual spacing
sp_before_semi = remove
sp_before_semi_for = remove
sp_after_semi_for = force
sp_inside_braces = add
sp_inside_braces_empty = remove
sp_before_bit_colon = force
sp_after_bit_colon = force
sp_cond_question = force
sp_cond_colon = force
align_var_def_span = 0
align_var_struct_span = 1
align_var_class_span = 1
align_var_struct_span_num_cmt_lines = 5000
align_var_class_span_num_cmt_lines = 5000
align_var_def_star_style = 0
align_var_def_amp_style = 0
align_typedef_span = 1
align_typedef_func = 1
align_typedef_star_style = 0
align_func_proto_span = 1
align_func_proto_star_style = 0
align_enum_equ_span = 1
align_on_tabstop = false
align_with_tabs = false
cmt_reflow_mode = 1
cmt_indent_multi = false
cmt_width = 0
pp_ignore_define_body = true
disable_processing_cmt = "clang-format off"
enable_processing_cmt = "clang-format on"
pp_indent = ignore # manual indentation
pp_space_after = remove
nl_brace_struct_var = remove
align_keep_extra_space = true # manual columns
align_enum_equ_span_num_cmt_lines = 5000
