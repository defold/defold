<title id="title">Query reservations and caller-owned range jobs</title>
<desc id="desc">Explosion and Regenerate are both ready. The store admits one health writer and returns busy to the other. Independent queries can proceed. The caller splits admitted rows into jobs, joins them, releases access, and then applies pending content changes.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs>
<rect width="1080" height="355" rx="12" fill="#f6f8fc"/>
<g font-family="Arial,sans-serif" fill="#172b45">
<text x="28" y="34" font-size="20" font-weight="bold">The caller schedules jobs; the store reserves access</text>
<g fill="white" stroke="#b8c9db"><rect x="28" y="62" width="230" height="162" rx="8"/><rect x="316" y="62" width="335" height="162" rx="8"/><rect x="714" y="62" width="338" height="162" rx="8"/></g>
<g font-size="17" font-weight="bold"><text x="44" y="88">Ready updates</text><text x="333" y="88">Short admission check</text><text x="731" y="88">Caller-owned jobs</text></g>
<g font-size="15"><text x="44" y="123">Explosion: write health</text><text x="44" y="151">Regenerate: write health</text><text x="44" y="194">Independent light query</text>
<text x="333" y="123">Admit one overlapping writer</text><text x="333" y="151">Return BUSY to the other</text><text x="333" y="194">Allow independent access</text>
<text x="731" y="123">Split matched rows into ranges</text><text x="731" y="151">One iterator per job</text><text x="731" y="194">No row locks or lifetime checks</text></g>
<g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M258 145H310"/><path d="M651 145H708"/><path d="M883 224V263H731"/></g>
<rect x="28" y="245" width="690" height="76" rx="8" fill="#e5effb" stroke="#b8c9db"/>
<text x="44" y="274" font-size="16" font-weight="bold">Join jobs → release access → retry waiting updates</text>
<text x="44" y="300" font-size="15">After all queries end: apply prepared content loads and unloads</text>
</g></svg>