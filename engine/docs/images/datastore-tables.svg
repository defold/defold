<title id="title">Runtime Format: borrowed blobs and shared mutable tables</title>
<desc id="desc">The resource system owns two immutable blobs outside the store. A blob with PointLight and SpotLight supplies a resource pool with rows for game objects A and B. A second PointLight blob supplies a separate pool for C. Registration records identify each game object’s component rows. A stable ID map locates rows even when dense removal moves them.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52657a"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b42;font-size:17px}
.title{font-size:24px;font-weight:700}.label{font-size:18px;font-weight:700}
.small{font-size:15px;fill:#52657a}.mono{font-family:Menlo,Consolas,monospace;font-size:15px}
.arrow{fill:none;stroke:#52657a;stroke-width:1.8;marker-end:url(#arrow)}</style>
<rect width="1080" height="798" rx="12" fill="#f5f8fc"/>
<text x="28" y="40" class="title">Runtime Format: borrowed blobs and shared mutable tables</text>
<text x="28" y="71" class="small">Resource system owns these allocations; the datastore retains references.</text>
<rect x="28" y="89" width="664" height="112" rx="7" fill="#fff1da" stroke="#c3d0dd" stroke-width="1.5"/>
<text x="48" y="120" class="label">Loaded blob: PointLight + SpotLight</text>
<text x="48" y="151">Shared metadata · default rows · strings / dynamic payloads</text>
<text x="48" y="180" class="small">Immutable bytes, loaded once; DataLoadBlob borrows the buffer.</text>
<rect x="724" y="89" width="328" height="112" rx="7" fill="#fff1da" stroke="#c3d0dd" stroke-width="1.5"/>
<text x="744" y="120" class="label">Another loaded blob</text>
<text x="744" y="151">PointLight defaults + metadata</text>
<text x="744" y="180" class="small">A separate resource handle</text>
<rect x="28" y="246" width="1024" height="512" rx="10" fill="none" stroke="#8ba2ba" stroke-width="1.5"/>
<text x="48" y="278" class="label">Data store</text>
<path d="M 352 201 V 308" class="arrow"/>
<path d="M 888 201 V 308" class="arrow"/>
<rect x="48" y="316" width="644" height="332" rx="7" fill="#ffffff" stroke="#c3d0dd" stroke-width="1.5"/>
<text x="68" y="346" class="label">Pool for the first blob</text>
<text x="68" y="372" class="small">Tables share resource metadata; rows hold mutable values.</text>
<rect x="68" y="391" width="282" height="158" rx="7" fill="#e8edf2" stroke="#c3d0dd" stroke-width="1.5"/>
<text x="84" y="418" class="label">PointLight table</text>
<rect x="84" y="434" width="250" height="42" rx="4" fill="#e2f3ee" stroke="#c3d0dd" stroke-width="1.5"/>
<text x="100" y="462" class="mono">A: light + range</text>
<rect x="84" y="484" width="250" height="42" rx="4" fill="#e5ecfa" stroke="#c3d0dd" stroke-width="1.5"/>
<text x="100" y="512" class="mono">B: light + range</text>
<rect x="366" y="391" width="306" height="158" rx="7" fill="#e8edf2" stroke="#c3d0dd" stroke-width="1.5"/>
<text x="382" y="418" class="label">SpotLight table</text>
<rect x="382" y="434" width="274" height="42" rx="4" fill="#e2f3ee" stroke="#c3d0dd" stroke-width="1.5"/>
<text x="398" y="462" class="mono">A: light + range + cones</text>
<rect x="382" y="484" width="274" height="42" rx="4" fill="#e5ecfa" stroke="#c3d0dd" stroke-width="1.5"/>
<text x="398" y="512" class="mono">B: light + range + cones</text>
<text x="68" y="580" class="mono">Registration A → A’s two component row IDs</text>
<text x="68" y="608" class="mono">Registration B → B’s two component row IDs</text>
<text x="68" y="634" class="small">Each registration owns its replacement strings / containers.</text>
<rect x="724" y="316" width="308" height="332" rx="7" fill="#ffffff" stroke="#c3d0dd" stroke-width="1.5"/>
<text x="744" y="346" class="label">Pool for the other blob</text>
<text x="744" y="372" class="small">Kept separate, even if types match</text>
<rect x="744" y="391" width="268" height="158" rx="7" fill="#e8edf2" stroke="#c3d0dd" stroke-width="1.5"/>
<text x="760" y="418" class="label">PointLight table</text>
<rect x="760" y="434" width="236" height="42" rx="4" fill="#fff1da" stroke="#c3d0dd" stroke-width="1.5"/>
<text x="776" y="462" class="mono">C: light + range</text>
<text x="744" y="580" class="mono">Registration C → C’s row</text>
<text x="744" y="608" class="small">Same ownership rules</text>
<rect x="48" y="674" width="984" height="60" rx="7" fill="#e5ecfa" stroke="#c3d0dd" stroke-width="1.5"/>
<text x="68" y="700" class="label">Stable DataId → current table and row index</text>
<text x="68" y="723" class="small">Rows also track their owner, component name and registration. Queries cache table bindings.</text>
<text x="28" y="785" class="small">Removing A leaves B intact. A resource pool is released when its last registration is removed.</text>
</svg>
