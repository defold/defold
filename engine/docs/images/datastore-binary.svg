<title id="title">File Format: overview, struct layouts and references</title>
<desc id="desc">The directory references the PointLight and SpotLight tables and the shared string area. On the right, table_offsets selects a DataTableHeader. Table counts describe the metadata array and fixed-stride rows. DataFileFieldMeta m_ChildIndex selects child entries in the same metadata array; m_ByteOffset locates a value relative to the row. Solid arrows show offset or index references, and dashed arrows show layout expansion or sizes. Struct layouts list byte offsets, names and types.</desc>
<defs>
<marker id="reference-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#237c76"/></marker>
<marker id="layout-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52657a"/></marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172b42;font-size:17px}
.title{font-size:24px;font-weight:700}.label{font-size:18px;font-weight:700}
.small{font-size:15px;fill:#52657a}.field{font-family:Menlo,Consolas,monospace;font-size:13px}
.reference{fill:none;stroke:#237c76;stroke-width:2;marker-end:url(#reference-arrow)}
.layout{fill:none;stroke:#52657a;stroke-width:1.8;stroke-dasharray:5 4;marker-end:url(#layout-arrow)}
.reference-label{font-size:14px;fill:#237c76}
</style>
