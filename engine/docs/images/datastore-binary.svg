<text x="122" y="825" class="small">Layout expansion / size</text>
<text x="64" y="865" class="small">Directory offsets start at the blob.</text>
<text x="64" y="893" class="small">Field offsets start at the row</text>
<text x="64" y="916" class="small">including inline members.</text>
<text x="64" y="954" class="small">Padding is not a named field.</text>
<text x="28" y="1017" class="small">Within each table: header → tags → metadata → component names → rows → dynamic payloads</text>
<text x="28" y="1051" class="small">Fixed structs are in data.h. table_offsets[] follows DataFileDirectory; reserved fields are zero. Byte is struct-relative.</text>
