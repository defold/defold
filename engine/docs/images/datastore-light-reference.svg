<title id="title">ReferencedPointLight: one referenced Light</title>
<desc id="desc">Serialized layout for CreateReferencedLightExample. The sixteen-byte value row contains a uint64 blob offset at byte zero and a double range at byte eight. The offset points to a 64-byte dynamic Light container, with names, kinds and member offsets before color at byte 40 and intensity at byte 56. Byte columns are local offsets; arrows follow absolute blob offsets. The separate row record is omitted.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#237c76"/></marker>
<marker id="expand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52657a"/></marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #172b42; font-size: 18px; }
.title { font-size: 26px; font-weight: 700; }
.label { font-size: 19px; font-weight: 700; }
.small { font-size: 16px; fill: #52657a; }
.mono { font-family: Menlo, Consolas, monospace; font-size: 16px; }
.reference { fill: none; stroke: #237c76; stroke-width: 2; marker-end: url(#arrow); }
.expansion { fill: none; stroke: #52657a; stroke-width: 1.8; stroke-dasharray: 5 4; marker-end: url(#expand); }
</style>
<rect width="1100" height="616" rx="12" fill="#f5f8fc"/>
<text x="32" y="42" class="title">ReferencedPointLight: one referenced Light</text>
<text x="32" y="72" class="small">File layout · byte columns are local offsets · arrows follow blob-relative offsets</text>
<rect x="32" y="112" width="488" height="156" rx="7" fill="#e5ecfa" stroke="#c3d0dd" stroke-width="1.5"/>
<text x="50" y="140" class="label">ReferencedPointLight · 16-byte row</text>
<text x="500" y="140" class="small" text-anchor="end">Byte</text>
<text x="50" y="184" class="mono">uint64_t light;</text>
<text x="500" y="184" class="mono" text-anchor="end">0</text>
<text x="50" y="212" class="mono">double range;</text>
<text x="500" y="212" class="mono" text-anchor="end">8</text>
<text x="50" y="246" class="small">range = 10.0</text>
<path d="M 520 180 H 580" class="reference"/>
<rect x="580" y="112" width="488" height="396" rx="7" fill="#e2f3ee" stroke="#c3d0dd" stroke-width="1.5"/>
<text x="598" y="140" class="label">Light · 64-byte dynamic struct</text>
<text x="1048" y="140" class="small" text-anchor="end">Byte</text>
<text x="598" y="174" class="mono">uint32_t m_ByteSize = 64;</text>
<text x="1048" y="174" class="mono" text-anchor="end">0</text>
<text x="598" y="200" class="mono">uint32_t m_Count = 2;</text>
<text x="1048" y="200" class="mono" text-anchor="end">4</text>
<text x="598" y="226" class="mono">uint64_t names[2];</text>
<text x="1048" y="226" class="mono" text-anchor="end">8</text>
<text x="598" y="252" class="mono">uint32_t kinds[2];</text>
<text x="1048" y="252" class="mono" text-anchor="end">24</text>
<text x="598" y="278" class="mono">uint32_t · offsets[0]</text>
<text x="1048" y="278" class="mono" text-anchor="end">32</text>
<text x="598" y="304" class="mono">uint32_t · offsets[1]</text>
<text x="1048" y="304" class="mono" text-anchor="end">36</text>
<text x="598" y="330" class="mono">float color[3];</text>
<text x="1048" y="330" class="mono" text-anchor="end">40</text>
<text x="598" y="356" class="mono">uint8_t padding[4];</text>
<text x="1048" y="356" class="mono" text-anchor="end">52</text>
<text x="598" y="382" class="mono">double intensity;</text>
<text x="1048" y="382" class="mono" text-anchor="end">56</text>
<text x="598" y="418" class="small">names: hash(&quot;color&quot;), hash(&quot;intensity&quot;)</text>
<text x="598" y="444" class="small">kinds: DS_TYPE_VECTOR3, DS_TYPE_NUMBER</text>
<text x="598" y="484" class="small">color = (1.0, 1.0, 1.0); intensity = 1.0</text>
<path d="M 580 278 H 564 V 330 H 580" class="reference"/>
<path d="M 580 304 H 552 V 382 H 580" class="reference"/>
<text x="50" y="320" class="small">The row stores a blob offset, not a C pointer.</text>
<text x="50" y="348" class="small">The Light payload is in the same blob.</text>
<text x="50" y="394" class="small">Its metadata precedes the member values.</text>
<text x="50" y="422" class="small">This payload cannot be cast to the native Light struct.</text>
<text x="32" y="554" class="small">The separate 32-byte DSRow record is omitted. The component value-row stride remains sixteen bytes.</text>
<text x="32" y="582" class="small">Native input pointers are copied during creation; serialization writes the current values and blob offsets.</text>
</svg>
