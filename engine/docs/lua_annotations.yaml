# Cross-document metadata for the generated Lua language-server annotations.
#
# The initial contents were reconciled with defold-annotations at:
# https://github.com/astrochili/defold-annotations/tree/b0731459640bb6aa9f91ea24128bb6584c270160
#
# Source-specific documentation corrections belong in their source API comments,
# not in this file.

migration:
  source_commit: b0731459640bb6aa9f91ea24128bb6584c270160
  patch_files: 31
  patch_entries: 176
  manifest: lua_annotations_migration.json

standard_namespaces:
  - base
  - coroutine
  - debug
  - io
  - math
  - os
  - package
  - string
  - table

# These are engine callbacks rather than callable globals. The editor's bundled
# LuaLS plugin supplies their signatures at definitions in supported script files.
excluded_functions:
  - init
  - final
  - update
  - late_update
  - fixed_update
  - on_message
  - on_input
  - on_reload

excluded_function_patterns:
  - "client:*"
  - "server:*"
  - "master:*"
  - "connected:*"
  - "unconnected:*"

method_classes:
  master: socket_master
  client: socket_client
  server: socket_server
  connected: socket_connected
  unconnected: socket_unconnected

allowed_diagnostics:
  - lowercase-global
  - missing-return
  - args-after-dots

aliases:
  editor.command_location: '"Assets"|"Bundle"|"Code"|"Debug"|"Edit"|"Help"|"Outline"|"Project"|"Scene"|"View"'
  editor.resource_definition: "{[1]:string, [2]?:string}"
  editor.schema: userdata
  editor.component: userdata
  editor.transaction_step: userdata
  editor.tiles: userdata
  editor.image: userdata
  editor.command: userdata
  editor.message: userdata
  http.response: userdata
  http.route: userdata
  http.server.handler: "fun(request:http.server.request):(http.response|integer|nil, table<string, string>|nil, string|nil)"
  zip.entries: "(string|zip.entry)[]"
  zip.entry: "{[1]:string, [2]?:string, method?:zip.METHOD, level?:integer}"
  zip.unpack_options: "{on_conflict:zip.ON_CONFLICT}"

type_replacements:
  b2BodyType: b2d.body.B2
  b2ContactEdge: b2d.contact_edge
  b2MassData: b2d.mass_data
  b2Transform: b2d.transform

generics:
  editor.ui.component: table<string, any>
  vmath.clamp: number|vector3|vector4
  vmath.dot: vector3|vector4
  vmath.normalize: vector3|vector4|quaternion
  vmath.mul_per_elem: vector3|vector4
  vmath.slerp: vector3|vector4
  vmath.lerp: vector3|vector4

function_overloads:
  http.server.route:
    - "fun(path:string, handler:http.server.handler):http.route"
    - "fun(path:string, method:string, handler:http.server.handler):http.route"
    - 'fun(path:string, as:"string"|"json", handler:http.server.handler):http.route'
    - "fun(path:string, openapi:table<string, any>, handler:http.server.handler):http.route"
    - 'fun(path:string, method:string, as:"string"|"json", handler:http.server.handler):http.route'
    - "fun(path:string, method:string, openapi:table<string, any>, handler:http.server.handler):http.route"
    - 'fun(path:string, as:"string"|"json", openapi:table<string, any>, handler:http.server.handler):http.route'
  render.render_target:
    - "fun(name:string, parameters:table<graphics.BUFFER_TYPE, { format:graphics.TEXTURE_FORMAT, width:integer, height:integer, min_filter?:graphics.TEXTURE_FILTER, mag_filter?:graphics.TEXTURE_FILTER, u_wrap?:graphics.TEXTURE_WRAP, v_wrap?:graphics.TEXTURE_WRAP, flags?:render.RENDER_TARGET_FLAG }>):render_target"
  zip.pack:
    - "fun(output_path:string, entries:zip.entries)"
  zip.unpack:
    - "fun(archive_path:string, opts:zip.unpack_options)"
    - "fun(archive_path:string, paths:string[])"
    - "fun(archive_path:string, target_path:string, paths:string[])"
    - "fun(archive_path:string, opts:zip.unpack_options, paths:string[])"

classes:
  editor.command_context:
    fields:
      selection?: "string|userdata|(string|userdata)[]"
      active_view?: userdata
      argument?: any
  http.server.request:
    fields:
      "[string]": any
      path: string
      method: string
      headers: "table<string, string|string[]>"
      query?: string
      body?: any
  # Keep hashes nominal in LuaLS. A plain alias is expanded to userdata in
  # hovers, hiding the useful API type.
  hash: {}
  vector3:
    operators:
      add: ["vector3", "vector3"]
      sub: ["vector3", "vector3"]
      mul: ["number", "vector3"]
      unm: [null, "vector3"]
  vector4:
    operators:
      add: ["vector4", "vector4"]
      sub: ["vector4", "vector4"]
      mul: ["number", "vector4"]
      unm: [null, "vector4"]
