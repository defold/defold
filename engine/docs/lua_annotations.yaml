# Cross-document metadata for the generated Lua language-server annotations.
#
# The initial contents were reconciled with defold-annotations at:
# https://github.com/astrochili/defold-annotations/tree/b0731459640bb6aa9f91ea24128bb6584c270160
#
# Source-specific documentation corrections belong in their source API comments,
# not in this file.

migration:
  source_commit: b0731459640bb6aa9f91ea24128bb6584c270160
  patch_files: 31
  patch_entries: 176
  manifest: lua_annotations_migration.json

standard_namespaces:
  - base
  - coroutine
  - debug
  - io
  - math
  - os
  - package
  - string
  - table

excluded_functions:
  - init
  - update
  - fixed_update
  - on_input
  - on_message
  - on_reload
  - final

excluded_function_patterns:
  - "client:*"
  - "server:*"
  - "master:*"
  - "connected:*"
  - "unconnected:*"

allowed_diagnostics:
  - lowercase-global
  - missing-return
  - args-after-dots

known_types:
  - nil
  - any
  - boolean
  - number
  - integer
  - string
  - userdata
  - function
  - thread
  - table
  - file

