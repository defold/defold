<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Font Lister</title>
</head>
<body>
  <button id="loadFonts">Load system fonts</button>
  <pre id="output"></pre>

  <script>
    var Module = {
      print: function(text) {
        const out = document.getElementById('output');
        out.textContent += text + "\n";
      },
      printErr: function(text) {
        const out = document.getElementById('output');
        out.textContent += "[err] " + text + "\n";
      },
      onRuntimeInitialized: function() {
        document.getElementById('loadFonts').addEventListener('click', async function() {
          try {
            await Module.ccall('list_system_fonts', null, [], [], { async: true });
          } catch (e) {
            Module.printErr(e);
          }
        });
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
