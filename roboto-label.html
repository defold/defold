<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roboto Bold Label</title>
    <style>
        @font-face {
            font-family: "Roboto";
            src: local("Roboto Bold"), local("Roboto-Bold");
            font-style: normal;
            font-weight: 700;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            padding: 40px;
            overflow-x: auto;
            background: #ffffff;
            color: #111111;
            font-family: "Roboto", Arial, sans-serif;
            font-weight: 700;
        }

        .label-28 {
            font-size: 28px;
            line-height: 1.2;
        }

        .label-840 {
            margin-top: 48px;
            font-size: 840px;
            line-height: 0.9;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="label-28">Label</div>
    <div class="label-840">Label</div>
</body>
</html>
