name: Build Dawn

on:
  push:
    branches:
      - webgpu-dawn-support
  workflow_dispatch:
    inputs:
      push_changes:
        type: boolean
        description: Commit rebuilt packages to the selected branch
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Dawn (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arm64-macos
            runner: macos-26
          - platform: arm64-linux
            runner: ubuntu-22.04-arm
          - platform: x86_64-linux
            runner: ubuntu-22.04
          - platform: x86_64-win32
            runner: windows-2025-vs2026
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_PLATFORM_NAME: ${{ matrix.platform }}
      CMAKE_BUILD_PARALLEL_LEVEL: 3
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: temurin

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.3.4

      - name: Install compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Cache Dawn sources and dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: external/dawn/build/${{ matrix.platform }}/sources
          key: dawn-sources-v1-${{ matrix.platform }}-${{ hashFiles('external/dawn/CMakeLists.txt') }}

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: x64

      - name: Install dependencies
        shell: bash
        run: ci/ci.sh install --platform="$BUILD_PLATFORM_NAME"

      - name: Install Linux window-system headers
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libx11-dev libwayland-dev

      - name: Build Dawn package
        shell: bash
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          CMAKE_OBJC_COMPILER_LAUNCHER: sccache
          CMAKE_OBJCXX_COMPILER_LAUNCHER: sccache
        run: |
          set -euo pipefail
          ./scripts/build.py --save-env-path=ci/env.sh save_env
          # save_env exports ORIGINAL_PATH on Windows; keep the Bash path separately.
          DAWN_BUILD_PATH="$PATH"
          source ci/env.sh
          if [ "$RUNNER_OS" == "Windows" ]; then
            export PATH="$DAWN_BUILD_PATH:$DYNAMO_HOME/ext/bin"
          fi
          ./scripts/build.py build_external --package=dawn --platform="$BUILD_PLATFORM_NAME"

      - name: Archive Dawn package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dawn-${{ matrix.platform }}
          path: packages/dawn-*-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  push-packages:
    if: ${{ github.ref_type == 'branch' && (github.event_name == 'push' || inputs.push_changes) }}
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout built revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download artifacts to packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dawn-*
          path: packages
          merge-multiple: true

      - name: Check package sizes
        shell: bash
        run: |
          set -euo pipefail
          for package in packages/dawn-*.tar.gz; do
            size=$(wc -c < "$package")
            if [ "$size" -gt 104857600 ]; then
              echo "::error::$package exceeds GitHub's 100 MiB file limit ($size bytes)"
              exit 1
            fi
          done

      - name: Commit package updates
        shell: bash
        env:
          BUILD_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.email "services@defold.se"
          git config user.name "Defold Services"
          git add packages/dawn-*.tar.gz

          if git diff --cached --quiet; then
            echo "No package changes to commit"
            exit 0
          fi

          git commit -m "packages: update Dawn"
          git push origin "HEAD:refs/heads/$BUILD_BRANCH"
