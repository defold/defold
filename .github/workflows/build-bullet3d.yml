name: Build Bullet3D

on:
  workflow_dispatch:
    inputs:
      push_changes:
        description: 'Commit built package tarballs to ./packages on the branch'
        type: boolean
        default: false

permissions:
  contents: write
  packages: read

jobs:
  build:
    uses: ./.github/workflows/build-external-template.yml
    with:
      package_name: 'bullet3d'
      result_folder_name: 'bullet'
      result_lib_name: 'libBulletCollision'
      package_version: '3.25'
      artifact_dir: 'packages'
      setup_msvc: true
      build_command: './scripts/build.py --platform="$BUILD_PLATFORM_NAME" --package=bullet3d build_external'
      push_changes: ${{ inputs.push_changes }}
    secrets:
      dm_packages_url: ${{ secrets.DM_PACKAGES_URL }}
