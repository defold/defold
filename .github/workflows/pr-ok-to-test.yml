name: PR - ok to test

# Builds an external (fork) pull request as if it were a branch in this repository.
#
# A fork PR gets no CI today: every engine job in main-ci.yml is gated on the event not
# being a `pull_request`, and the fork's branch does not exist here to check out. To get
# a fork PR built, a maintainer reviews the diff and applies the "ok to test" label. This
# workflow then mirrors the reviewed commit to `contrib/pr-<number>` and asks main-ci.yml
# to build that branch through a `repository_dispatch` of type `contrib-build`.
#
# The mirrored code is untrusted - nobody with push access wrote it - yet it runs in a
# workflow that can normally see repository secrets. main-ci.yml therefore withholds every
# credential from a `contrib-build` dispatch and isolates its caches. See README_CI.md.
#
# `repository_dispatch` is used rather than a `push` trigger for two reasons: GitHub always
# runs a dispatched workflow from the default branch, so the pull request cannot modify the
# CI definition that builds it, and GITHUB_TOKEN is allowed to fire it (a push made with
# GITHUB_TOKEN would not start any workflow at all).

on:
  pull_request_target:
    types: [labeled, synchronize, closed]

permissions: {}

concurrency:
  group: ok-to-test-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  OK_TO_TEST_LABEL: 'ok to test'
  MIRROR_BRANCH: 'contrib/pr-${{ github.event.pull_request.number }}'
  PR_NUMBER: '${{ github.event.pull_request.number }}'
  HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
  GH_TOKEN: '${{ github.token }}'
  GH_REPO: '${{ github.repository }}'

jobs:
  # ---- MIRROR A REVIEWED PULL REQUEST INTO contrib/pr-<n> ------------------
  mirror:
    if: github.event.action == 'labeled' && github.event.label.name == 'ok to test'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 'Check that the label was applied by someone with push access'
        # Triage permission is enough to add a label, but not enough to decide that
        # unreviewed code may run in a trusted context.
        env:
          SENDER: '${{ github.event.sender.login }}'
        run: |
          level=$(gh api "repos/${GH_REPO}/collaborators/${SENDER}/permission" --jq '.permission')
          echo "Label applied by ${SENDER} with permission '${level}'"
          case "${level}" in
            admin|maintain|write) ;;
            *) echo "::error::'${OK_TO_TEST_LABEL}' may only be applied by someone with push access"; exit 1 ;;
          esac

      - name: 'Check that the pull request targets a build branch'
        env:
          BASE_REF: '${{ github.event.pull_request.base.ref }}'
        run: |
          base="${BASE_REF}"
          case "${base}" in
            dev) ;;
            *) echo "::error::Only pull requests against dev can be built"; exit 1 ;;
          esac

      - name: 'Checkout the base branch'
        # Only the base branch is checked out. Nothing from the pull request is ever
        # executed in this job - it is fetched as objects and pushed, never run.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: '${{ github.event.pull_request.base.ref }}'
          persist-credentials: true

      - name: 'Mirror the reviewed commit to ${{ env.MIRROR_BRANCH }}'
        run: |
          set -e
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          fetched=$(git rev-parse FETCH_HEAD)
          if [ "${fetched}" != "${HEAD_SHA}" ]; then
            echo "::error::The pull request head moved while the label was being processed (${HEAD_SHA} -> ${fetched}). Re-review and label again."
            exit 1
          fi
          echo "Mirroring ${HEAD_SHA} to ${MIRROR_BRANCH}"
          git push --force origin "${HEAD_SHA}:refs/heads/${MIRROR_BRANCH}"

      - name: 'Summarise build-affecting files in the diff'
        # These paths are executed by the build itself, so a reviewer needs to have looked
        # at them specifically. Workflow files under .github/ are inert in a contrib build
        # (the dispatched run uses the definitions from the default branch) but they still
        # have to be reviewed before the pull request is merged. The list is kept in a file
        # rather than a step output: the names come from the pull request, and this job has
        # write access.
        run: |
          gh pr diff "${PR_NUMBER}" --name-only \
            | grep -E '(^|/)(wscript|CMakeLists\.txt|copy\.sh)$|^ci/|^scripts/build\.py$|^build_tools/|^\.github/|\.gradle$|gradle-wrapper|^packages/|^editor/tasks/|^editor/scripts/' \
            > build-affecting-files.txt || true

      - name: 'Ask main-ci.yml to build the mirrored branch'
        id: dispatch
        run: |
          set -e
          echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          gh api "repos/${GH_REPO}/dispatches" \
            -f event_type=contrib-build \
            -F "client_payload[branch]=${MIRROR_BRANCH}" \
            -F "client_payload[sha]=${HEAD_SHA}" \
            -F "client_payload[pr]=${PR_NUMBER}" \
            -F "client_payload[skip_sign]=true"

      - name: 'Find the dispatched run'
        id: run
        # repository_dispatch returns 204 with no run id, so look for the run it started.
        # A run carries no reference to the dispatch that asked for it, so only a single
        # candidate is accepted: if another pull request was labelled in the same window
        # there is nothing to tell the two runs apart, and picking one would link the
        # wrong build. Best effort either way - the comment falls back to the workflow page.
        run: |
          since='${{ steps.dispatch.outputs.since }}'
          url="https://github.com/${GH_REPO}/actions/workflows/main-ci.yml"
          for _ in $(seq 1 12); do
            sleep 5
            found=$(gh api "repos/${GH_REPO}/actions/runs?event=repository_dispatch&per_page=20" \
                      --jq "[.workflow_runs[] | select(.name == \"CI - Main\") | select(.created_at >= \"${since}\")] | .[].html_url" 2>/dev/null || true)
            count=$(printf '%s\n' "${found}" | grep -c . || true)
            if [ "${count}" -eq 1 ]; then
              url="${found}"
              break
            fi
            if [ "${count}" -gt 1 ]; then
              echo "::warning::${count} dispatched runs started in this window, linking the workflow rather than guessing"
              break
            fi
          done
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: 'Comment on the pull request'
        env:
          RUN_URL: '${{ steps.run.outputs.url }}'
        run: |
          {
            printf 'Building `%s` from %s.\n\n' "${MIRROR_BRANCH}" "${HEAD_SHA}"
            printf 'Run: %s\n\n' "${RUN_URL}"
            printf 'This build runs without any signing, publishing or private-repository\n'
            printf 'credentials, and does not archive or release anything.\n'
            if [ -s build-affecting-files.txt ]; then
              printf '\nBuild-affecting files in this pull request - review these before merging:\n\n```\n'
              cat build-affecting-files.txt
              printf '```\n'
            fi
            printf '\nPushing new commits removes the `%s` label and deletes the branch.\n' "${OK_TO_TEST_LABEL}"
          } > comment.md
          gh pr comment "${PR_NUMBER}" --body-file comment.md

      - name: 'Withdraw the label if mirroring failed'
        # Only while the build has not been asked for yet. After the dispatch main-ci is
        # already cloning the branch, and deleting it would break a run that is under way -
        # a failure in the steps after the dispatch costs a comment, not a build.
        if: failure() && steps.dispatch.outcome != 'success'
        run: |
          gh pr edit "${PR_NUMBER}" --remove-label "${OK_TO_TEST_LABEL}" || true
          gh api -X DELETE "repos/${GH_REPO}/git/refs/heads/${MIRROR_BRANCH}" || true
          gh pr comment "${PR_NUMBER}" --body "Could not start a build for this pull request. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} - the \`${OK_TO_TEST_LABEL}\` label has been removed." || true

  # ---- REVOKE THE LABEL WHEN NEW COMMITS ARRIVE ------------------
  revoke:
    if: github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'ok to test')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 'Remove the label and the mirrored branch'
        # The label approves one reviewed commit, not the pull request. Anything pushed
        # after it has not been reviewed and must not run in a trusted context.
        run: |
          # The branch goes first, and the label removal cannot stop it: the label may
          # already have been withdrawn by the mirror job, and under 'bash -e' a failing
          # 'gh pr edit' would abort the step before the branch was deleted.
          gh api -X DELETE "repos/${GH_REPO}/git/refs/heads/${MIRROR_BRANCH}" || true
          gh pr edit "${PR_NUMBER}" --remove-label "${OK_TO_TEST_LABEL}" || true
          gh pr comment "${PR_NUMBER}" --body "New commits were pushed, so the \`${OK_TO_TEST_LABEL}\` label has been removed and \`${MIRROR_BRANCH}\` deleted. A maintainer needs to review the new commits and apply the label again to build them."

  # ---- CLEAN UP WHEN THE PULL REQUEST IS CLOSED ------------------
  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 'Delete the mirrored branch'
        run: |
          gh api -X DELETE "repos/${GH_REPO}/git/refs/heads/${MIRROR_BRANCH}" || true
          gh pr edit "${PR_NUMBER}" --remove-label "${OK_TO_TEST_LABEL}" || true
