name: CI - Cache maintenance

on:
  schedule:
    # Nightly at 02:47 UTC, before the engine nightly builds.
    - cron: '47 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report obsolete caches without deleting them'
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: cache-maintenance
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout maintenance scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: /ci/
          sparse-checkout-cone-mode: false
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.13
      - name: Report usage and prune obsolete caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci/prune_caches.py ${{ (github.event_name == 'schedule' || !inputs.dry_run) && '--delete' || '' }}
