      { name: 'Cache Defold downloads', if: github.event.action != 'contrib-build', uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae, with: { path: '~/.dcache', key: "${{ runner.os }}-${{ matrix.platform || 'default' }}-dcache-${{ hashFiles('build_tools/sdk.py', 'editor/tasks/leiningen/sass.clj') }}", restore-keys: "${{ runner.os }}-${{ matrix.platform || 'default' }}-dcache-\n${{ runner.os }}-dcache-" } }, # v5.0.5
      { name: 'Install Python', uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405, with: { python-version: 3.13} }, # v6.2.0
      { name: 'Install Java', uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654, with: { java-version: '25', distribution: 'temurin', cache: "${{ github.event.action == 'contrib-build' && '' || 'gradle' }}", cache-dependency-path: "com.dynamo.cr/com.dynamo.cr.bob/*.gradle\ncom.dynamo.cr/com.dynamo.cr.bob/gradle/wrapper/gradle-wrapper.properties\ncom.dynamo.cr/com.dynamo.cr.bob.test/*.gradle\ncom.dynamo.cr/com.dynamo.cr.bob.test/gradle/wrapper/gradle-wrapper.properties"} }, # v5.2.0
      { name: 'Install CMake', uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb }, # v4.3.4
      { name: 'Install dependencies', run: 'ci/ci.sh install --platform=${{ matrix.platform }}' },
      {
        name: 'Build engine',
        run: 'ci/ci.sh engine --platform=${{ matrix.platform }} ${{ env.OPTION_ARCHIVE }} --verbose'
      },
      {
        name: 'Upload engine build for the jobs downstream',
        # A contrib build has no S3 credentials, so bob and the editor pick the engine
        # up from here instead of from the archive. See pr-ok-to-test.yml.
        if: github.event.action == 'contrib-build',
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a, # v7.0.1
        with: {
          name: 'dynamo-home-${{ matrix.platform }}',
          path: "tmp/dynamo_home/bin\ntmp/dynamo_home/lib\ntmp/dynamo_home/share",
          if-no-files-found: 'error',
          retention-days: 1
        }
      },
      { name: 'Stop Gradle Daemon', run: 'com.dynamo.cr/com.dynamo.cr.bob/gradlew --stop' },
      {
        name: 'Notify if build status changed',
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc, # v3.0.5
        if: "failure() && github.event.action != 'contrib-build' && contains('|dev|beta|master|refs/heads/dev|refs/heads/beta|refs/heads/master|', format('|{0}|', github.event.client_payload.branch || github.ref))",
        with: { webhook: '${{ env.SLACK_WEBHOOK }}', webhook-type: incoming-webhook, errors: true,
                payload: '{"channel":"#defold-alarms-build","text":"<!here> *${{ job.status }}*: ${{ github.workflow }} / ${{ github.job }}${{ matrix.platform && format('' / {0}'', matrix.platform) || '''' }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open run> · <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"}' }
      }]

  bld-eng-private:
    # One job for the three private console platforms. They differ only in the private
    # repository to dispatch to and the targets to build, so the display name is pinned to
    # the historical per-platform job names and the targets ride in matrix.platform, which
    # is what the shared Slack notifier renders.
    name: 'bld-eng-${{ matrix.id }}'
    strategy:
      matrix:
        include:
          - { id: switch, title: 'Switch',      repo: 'defold/defold-switch', ref: "${{ vars.SWITCH_PRIVATE_REF || 'dev' }}", platform: 'arm64-nx64' }
          - { id: ps,     title: 'PlayStation', repo: 'defold/defold-ps4',    ref: "${{ vars.PS_PRIVATE_REF || 'dev' }}",     platform: 'x86_64-ps4,x86_64-ps5' }
          - { id: xbox,   title: 'Xbox',        repo: 'defold/defold-xbox',   ref: "${{ vars.XBOX_PRIVATE_REF || 'dev' }}",   platform: 'x86_64-xbone' }
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    if: (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'skip-ci-') && !startsWith(github.head_ref, 'DEFEDIT-'))) && ((github.event_name != 'repository_dispatch') || ((github.event_name == 'repository_dispatch') && (github.event.client_payload.skip_engine != true))) && github.event.action != 'contrib-build'
    steps:
      - { name: 'Checkout CI scripts', uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd, with: { ref: '${{env.BUILD_BRANCH}}', path: ci-check, sparse-checkout: 'ci' } } # v6.0.2
      - name: 'Check private platform changes'
        id: private_changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: 'echo "should_build=$(python ci-check/ci/ci.py should-build-private-platform)" >> "$GITHUB_OUTPUT"'
      - name: 'Dispatch private ${{ matrix.title }} build'
        if: steps.private_changes.outputs.should_build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SERVICES_GITHUB_TOKEN }}
        run: |
          public_branch="${{ env.BUILD_BRANCH || github.ref_name }}"
          channel="alpha"
          release="false"
          case "$public_branch" in
            master)
              channel="stable"
              release="true"
              ;;
            beta)
              channel="beta"
              release="true"
              ;;
            dev)
              release="true"
              ;;
          esac
          request_id="${{ github.run_id }}-${{ github.run_attempt }}-$(uuidgen | tr -d '-' | cut -c 1-12)"

          gh workflow run private-ci.yml \
            --repo ${{ matrix.repo }} \
            --ref "${{ matrix.ref }}" \
            -f public_repo="${{ github.repository }}" \
            -f public_branch="$public_branch" \
            -f public_sha="${{ github.event.client_payload.sha || github.event.pull_request.head.sha || github.sha }}" \
            -f source_run_id="${{ github.run_id }}" \
            -f source_run_attempt="${{ github.run_attempt }}" \
            -f request_id="$request_id" \
            -f targets="${{ matrix.platform }}" \
            -f channel="$channel" \
            -f release="$release"
      - {
        name: 'Notify if build status changed',
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc, # v3.0.5
        if: "failure() && github.event.action != 'contrib-build' && contains('|dev|beta|master|refs/heads/dev|refs/heads/beta|refs/heads/master|', format('|{0}|', github.event.client_payload.branch || github.ref))",
        with: { webhook: '${{ env.SLACK_WEBHOOK }}', webhook-type: incoming-webhook, errors: true,
                payload: '{"channel":"#defold-alarms-build","text":"<!here> *${{ job.status }}*: ${{ github.workflow }} / ${{ github.job }}${{ matrix.platform && format('' / {0}'', matrix.platform) || '''' }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open run> · <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"}' }
      }

  # ---- BUILD BOB AND SDK ------------------

  build-bob:
    needs: [bld-eng-darwin, bld-eng-windows, bld-eng-linux-x64, bld-eng-linux-arm64, bld-eng-android, bld-eng-web]
    runs-on: ubuntu-22.04
    if: (github.event_name != 'repository_dispatch') || ((github.event_name == 'repository_dispatch') && (github.event.client_payload.skip_bob != true))
    timeout-minutes: 15
    steps: [
      { name: 'Checkout', uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd, with: { ref: '${{env.BUILD_BRANCH}}' } }, # v6.0.2
      { name: 'Install Python', uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405, with: { python-version: 3.13} }, # v6.2.0
      { name: 'Install Java', uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654, with: { java-version: '25', distribution: 'temurin', cache: "${{ github.event.action == 'contrib-build' && '' || 'gradle' }}", cache-dependency-path: "com.dynamo.cr/com.dynamo.cr.bob/*.gradle\ncom.dynamo.cr/com.dynamo.cr.bob/gradle/wrapper/gradle-wrapper.properties\ncom.dynamo.cr/com.dynamo.cr.bob.test/*.gradle\ncom.dynamo.cr/com.dynamo.cr.bob.test/gradle/wrapper/gradle-wrapper.properties"} }, # v5.2.0
      {
        name: 'Download engine builds',
        # Without S3 credentials build_bob falls back to the artifacts in $DYNAMO_HOME,
        # so every engine build has to be restored there first.
        if: github.event.action == 'contrib-build',
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131, # v7.0.0
        with: {
          pattern: 'dynamo-home-*',
          merge-multiple: true,
          path: 'tmp/dynamo_home'
        }
      },
      {
        name: 'Build bob',
        run: 'ci/ci.sh --skip-tests ${{ env.OPTION_SKIP_ARCHIVE }} bob'
      },
      {
        name: 'Upload bob jar',
        if: (github.event_name != 'repository_dispatch') || ((github.event_name == 'repository_dispatch') && (github.event.client_payload.skip_bob != true)),
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a, # v7.0.1
        with: {
          name: 'bob-jar',
          path: '${{ github.workspace }}/com.dynamo.cr/com.dynamo.cr.bob/dist/bob.jar',
          retention-days: 2
        }
      },
      { name: 'Stop Gradle Daemon', run: 'com.dynamo.cr/com.dynamo.cr.bob/gradlew --stop' },
      {
        name: 'Notify if build status changed',
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc, # v3.0.5
        if: "failure() && github.event.action != 'contrib-build' && contains('|dev|beta|master|refs/heads/dev|refs/heads/beta|refs/heads/master|', format('|{0}|', github.event.client_payload.branch || github.ref))",
        with: { webhook: '${{ env.SLACK_WEBHOOK }}', webhook-type: incoming-webhook, errors: true,
                payload: '{"channel":"#defold-alarms-build","text":"<!here> *${{ job.status }}*: ${{ github.workflow }} / ${{ github.job }}${{ matrix.platform && format('' / {0}'', matrix.platform) || '''' }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open run> · <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"}' }
      }]

  test-bob:
    needs: [build-bob]
    runs-on: ubuntu-22.04
    if: (github.event_name != 'repository_dispatch') || ((github.event_name == 'repository_dispatch') && (github.event.client_payload.skip_bob != true))
    timeout-minutes: 15
    steps: [
      { name: 'Checkout', uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd, with: { ref: '${{env.BUILD_BRANCH}}' } }, # v6.0.2
      { name: 'Cache Defold downloads', if: github.event.action != 'contrib-build', uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae, with: { path: '~/.dcache', key: "${{ runner.os }}-${{ matrix.platform || 'default' }}-dcache-${{ hashFiles('build_tools/sdk.py', 'editor/tasks/leiningen/sass.clj') }}", restore-keys: "${{ runner.os }}-${{ matrix.platform || 'default' }}-dcache-\n${{ runner.os }}-dcache-" } }, # v5.0.5
      { name: 'Install Python', uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405, with: { python-version: 3.13} }, # v6.2.0
      { name: 'Install Java', uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654, with: { java-version: '25', distribution: 'temurin', cache: "${{ github.event.action == 'contrib-build' && '' || 'gradle' }}", cache-dependency-path: "com.dynamo.cr/com.dynamo.cr.bob/*.gradle\ncom.dynamo.cr/com.dynamo.cr.bob/gradle/wrapper/gradle-wrapper.properties\ncom.dynamo.cr/com.dynamo.cr.bob.test/*.gradle\ncom.dynamo.cr/com.dynamo.cr.bob.test/gradle/wrapper/gradle-wrapper.properties"} }, # v5.2.0
      {
        name: 'Download bob jar',
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131, # v7.0.0
        with: {
          name: 'bob-jar',
          path: '${{ github.workspace }}/com.dynamo.cr/com.dynamo.cr.bob/dist'
        }
      },
      {
        name: 'Test bob',
        run: 'ci/ci.sh test-bob'
      },
      { name: 'Stop Gradle Daemon', run: 'com.dynamo.cr/com.dynamo.cr.bob/gradlew --stop' },
      {
        name: 'Upload test results',
        if: failure(),
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a, # v7.0.1
        with: {
          name: 'test-result',
          path: '${{ github.workspace }}/com.dynamo.cr/com.dynamo.cr.bob.test/build/reports/tests/',
          retention-days: 2
        }
      },
      {
        name: 'Notify if build status changed',
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc, # v3.0.5
        if: "failure() && github.event.action != 'contrib-build' && contains('|dev|beta|master|refs/heads/dev|refs/heads/beta|refs/heads/master|', format('|{0}|', github.event.client_payload.branch || github.ref))",
        with: { webhook: '${{ env.SLACK_WEBHOOK }}', webhook-type: incoming-webhook, errors: true,
                payload: '{"channel":"#defold-alarms-build","text":"<!here> *${{ job.status }}*: ${{ github.workflow }} / ${{ github.job }}${{ matrix.platform && format('' / {0}'', matrix.platform) || '''' }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open run> · <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"}' }
      }]

  build-sdk:
    needs: [bld-eng-darwin, bld-eng-windows, bld-eng-linux-x64, bld-eng-linux-arm64, bld-eng-android, bld-eng-web]
    runs-on: ubuntu-22.04
    # The SDK is merged from the per-platform SDK archives on S3. A contrib build never
    # writes them, so there is nothing to merge.
    if: ((github.event_name != 'repository_dispatch') || ((github.event_name == 'repository_dispatch') && (github.event.client_payload.skip_sdk != true))) && github.event.action != 'contrib-build'
    timeout-minutes: 10
    steps: [
      { name: 'Checkout', uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd, with: { ref: '${{env.BUILD_BRANCH}}' } }, # v6.0.2
      { name: 'Install Python', uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405, with: { python-version: 3.13} }, # v6.2.0
      { name: 'Install libzip tools', run: 'sudo apt-get update && sudo apt-get install -y --no-install-recommends zipmerge' },
      {
        name: 'Build SDK',
        run: 'ci/ci.sh sdk'
      },
      {
        name: 'Notify if build status changed',
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc, # v3.0.5
        if: "failure() && github.event.action != 'contrib-build' && contains('|dev|beta|master|refs/heads/dev|refs/heads/beta|refs/heads/master|', format('|{0}|', github.event.client_payload.branch || github.ref))",
        with: { webhook: '${{ env.SLACK_WEBHOOK }}', webhook-type: incoming-webhook, errors: true,
                payload: '{"channel":"#defold-alarms-build","text":"<!here> *${{ job.status }}*: ${{ github.workflow }} / ${{ github.job }}${{ matrix.platform && format('' / {0}'', matrix.platform) || '''' }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open run> · <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"}' }
      }]

  # ---- BUILD EDITOR ------------------

  gen-release-notes:
    runs-on: ubuntu-22.04
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    steps: [
      { name: 'Checkout', uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd, with: { ref: '${{env.BUILD_BRANCH}}' } }, # v6.0.2
      { name: 'Install Python', uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405, with: { python-version: 3.13} }, # v6.2.0
      { name: 'Install Python dependencies', run: 'pip install requests' },
      {
        name: 'Generate release notes',
        if: github.event.action != 'contrib-build' && ((github.event_name != 'repository_dispatch') || ((github.event_name == 'repository_dispatch') && (github.event.client_payload.skip_editor != true))),
        run: 'ci/ci.sh gen-release-notes'
      },
      { name: 'Read version', id: version, run: 'echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"' },
      {
        name: 'Upload release notes artifact',
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a, # v7.0.1
        with: {
          name: 'release-notes',
          path: "releasenotes/${{ steps.version.outputs.version }}.md\nreleasenotes/${{ steps.version.outputs.version }}.json",
          if-no-files-found: 'ignore'
        }
      },
      {
        name: 'Notify if build status changed',
        uses: homoluctus/slatify@c4847b8c84e3e8076fd3c42cc00517a10426ed65, # v3.0.0
        if: "failure() && github.event.action != 'contrib-build' && contains('|dev|beta|master|refs/heads/dev|refs/heads/beta|refs/heads/master|', format('|{0}|', github.event.client_payload.branch || github.ref))",
        with: {type: '${{ job.status }}', job_name: '${{ job.status }}', channel: '#defold-alarms-build', url: '${{ env.SLACK_WEBHOOK }}',
               mention: 'here', mention_if: 'failure', commit: true, token: '${{ env.SERVICES_GITHUB_TOKEN }}'}
      }
    ]

  build-editor:
    # One job for every editor platform. matrix.name pins the check names to the ones the
    # separate build-editor-linux / -macos / -windows jobs produced, so branch protection
    # keeps working; the platform-specific steps are guarded on runner.os rather than on
    # the platform, so a new runner needs no new branch here.
    name: '${{ matrix.name }}'
    needs: [build-bob, gen-release-notes]
    runs-on: ${{ matrix.runner }}
    if: (github.event_name != 'repository_dispatch') || ((github.event_name == 'repository_dispatch') && (github.event.client_payload.skip_editor != true))
    timeout-minutes: 60
    # The Windows job already ran every one of its steps under bash.
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - { platform: x86_64-linux, runner: ubuntu-22.04,          name: 'build-editor-linux' }
          - { platform: x86_64-macos, runner: macos-26-intel,        name: 'build-editor-macos (x86_64-macos, macos-26-intel)' }
          - { platform: arm64-macos,  runner: macos-26,              name: 'build-editor-macos (arm64-macos, macos-26)' }
          - { platform: x86_64-win32, runner: windows-2025-vs2026,   name: 'build-editor-windows (x86_64-win32)' }
    steps: [
      { name: 'Checkout', uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd, with: { ref: '${{env.BUILD_BRANCH}}' } }, # v6.0.2
      { name: 'Cache Defold downloads', if: github.event.action != 'contrib-build', uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae, with: { path: '~/.dcache', key: "${{ runner.os }}-${{ matrix.platform || 'default' }}-dcache-${{ hashFiles('build_tools/sdk.py', 'editor/tasks/leiningen/sass.clj') }}", restore-keys: "${{ runner.os }}-${{ matrix.platform || 'default' }}-dcache-\n${{ runner.os }}-dcache-" } }, # v5.0.5
      { name: 'Cache lein installation and Maven dependencies', if: github.event.action != 'contrib-build', uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae, with: { path: "editor/build/lein\neditor/.m2/repository", key: "${{ runner.os }}-${{ matrix.platform || 'x86_64-linux' }}-lein-maven-editor-${{ hashFiles('editor/scripts/lein', 'editor/project.clj', 'editor/profiles.clj') }}", restore-keys: "${{ runner.os }}-${{ matrix.platform || 'x86_64-linux' }}-lein-maven-editor-\n${{ runner.os }}-lein-maven-editor-\n${{ runner.os }}-${{ matrix.platform || 'x86_64-linux' }}-lein-editor-\n${{ runner.os }}-lein-editor-" } }, # v5.0.5
      { name: 'Install Python', uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405, with: { python-version: 3.13} }, # v6.2.0
      { name: 'Install Java', uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654, with: { java-version: '25', distribution: 'temurin', cache: "${{ github.event.action == 'contrib-build' && '' || 'gradle' }}", cache-dependency-path: "com.dynamo.cr/com.dynamo.cr.bob/*.gradle\ncom.dynamo.cr/com.dynamo.cr.bob/gradle/wrapper/gradle-wrapper.properties\ncom.dynamo.cr/com.dynamo.cr.bob.test/*.gradle\ncom.dynamo.cr/com.dynamo.cr.bob.test/gradle/wrapper/gradle-wrapper.properties"} }, # v5.2.0
      { name: 'Set up Google Cloud SDK', if: runner.os == 'Windows', uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db, with: { version: 'latest' } }, # v3.0.1
      {
        name: 'Download bob jar',
        if: (github.event_name != 'repository_dispatch') || ((github.event_name == 'repository_dispatch') && (github.event.client_payload.skip_bob != true)),
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131, # v7.0.0
        with: {
          name: 'bob-jar',
          path: '${{ github.workspace }}/com.dynamo.cr/com.dynamo.cr.bob/dist'
        }
      },
      { name: 'Install dependencies', if: runner.os == 'Linux', run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libglw1-mesa-dev freeglut3-dev },
      {
        name: 'Install dependencies',
        if: runner.os == 'macOS',
        run: 'ci/ci.sh --keychain-cert="${{env.MACOS_CERTIFICATE}}" --keychain-cert-pass="${{env.MACOS_CERTIFICATE_PASS}}" install'
      },
      { name: 'Install dependencies', if: runner.os == 'Windows', run: 'ci/ci.sh install' },
      {
        name: 'Download release notes',
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131, # v7.0.0
        continue-on-error: true,
        with: {
          name: 'release-notes',
          path: 'releasenotes'
        }
      },
      {
        name: 'Download engine build',
        # A contrib build has no S3 credentials, so the editor is packed from the engine
        # binaries in $DYNAMO_HOME (--engine-artifacts=dynamo-home) rather than from the
        # archive, and --skip-distclean keeps them from being wiped.
        if: github.event.action == 'contrib-build',
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131, # v7.0.0
        with: {
          name: "dynamo-home-${{ matrix.platform || 'x86_64-linux' }}",
          path: 'tmp/dynamo_home'
        }
      },
      {
        name: 'Download docs and builtins',
        if: github.event.action == 'contrib-build' && runner.os != 'Linux',
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131, # v7.0.0
        with: {
          name: 'engine-share',
          path: 'tmp/dynamo_home/share'
        }
      },
      {
        name: 'Build editor',
        if: runner.os == 'Linux',
        run: 'ci/ci.sh build-editor --platform=${{ matrix.platform }} --skip-tests ${{ env.OPTION_EDITOR_LOCAL }}'
      },
      {
        name: 'Build editor',
        if: runner.os == 'macOS',
        run: 'ci/ci.sh build-editor --skip-tests ${{ env.OPTION_CODESIGN }} ${{ env.OPTION_EDITOR_LOCAL }} --platform=${{ matrix.platform }} --notarization-username="${{env.NOTARIZATION_USERNAME}}" --notarization-password="${{env.NOTARIZATION_PASSWORD}}" --notarization-itc-provider="${{env.NOTARIZATION_ITC_PROVIDER}}"'
      },
      {
        name: 'Build editor',
        if: runner.os == 'Windows',
        run: 'ci/ci.sh build-editor --skip-tests ${{ env.OPTION_CODESIGN }} ${{ env.OPTION_EDITOR_LOCAL }} --platform=${{ matrix.platform }} --gcloud-service-key="${{env.GCLOUD_EDITOR_SERVICE_KEY}}"'
      },
      {
        name: 'Archive editor',
        if: github.event.action != 'contrib-build',
        run: 'ci/ci.sh archive-editor --skip-install-ext --platform=${{ matrix.platform }}'
      },
      {
        name: 'Upload editor',
        if: github.event.action == 'contrib-build',
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a, # v7.0.1
        with: {
          name: 'editor-${{ matrix.platform }}',
          path: 'editor/target/editor/Defold-${{ matrix.platform }}.*',
          if-no-files-found: 'warn',
          retention-days: 2
        }
      },
      { name: 'Remove generated Bob artifact from Maven cache', shell: bash, run: 'rm -rf editor/.m2/repository/com/defold/lib/bob' },
      {
        name: 'Notify if build status changed',
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc, # v3.0.5
        if: "failure() && github.event.action != 'contrib-build' && contains('|dev|beta|master|refs/heads/dev|refs/heads/beta|refs/heads/master|', format('|{0}|', github.event.client_payload.branch || github.ref))",
        with: { webhook: '${{ env.SLACK_WEBHOOK }}', webhook-type: incoming-webhook, errors: true,
                payload: '{"channel":"#defold-alarms-build","text":"<!here> *${{ job.status }}*: ${{ github.workflow }} / ${{ github.job }}${{ matrix.platform && format('' / {0}'', matrix.platform) || '''' }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open run> · <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"}' }
      }
    ]

  test-editor-linux:
    needs: [build-bob, build-sdk]
    runs-on: ubuntu-22.04
    # build-sdk is skipped for a contrib build, which would skip this job as well.
    if: ${{ !cancelled() && needs.build-bob.result == 'success' && needs.build-sdk.result != 'failure' && ((github.event_name != 'repository_dispatch') || ((github.event_name == 'repository_dispatch') && (github.event.client_payload.skip_editor != true))) }}
    timeout-minutes: 60
    steps: [
      { name: 'Checkout', uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd, with: { ref: '${{env.BUILD_BRANCH}}' } }, # v6.0.2
      { name: 'Cache Defold downloads', if: github.event.action != 'contrib-build', uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae, with: { path: '~/.dcache', key: "${{ runner.os }}-${{ matrix.platform || 'default' }}-dcache-${{ hashFiles('build_tools/sdk.py', 'editor/tasks/leiningen/sass.clj') }}", restore-keys: "${{ runner.os }}-${{ matrix.platform || 'default' }}-dcache-\n${{ runner.os }}-dcache-" } }, # v5.0.5
      { name: 'Cache lein installation and Maven dependencies', if: github.event.action != 'contrib-build', uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae, with: { path: "editor/build/lein\neditor/.m2/repository", key: "${{ runner.os }}-${{ matrix.platform || 'x86_64-linux' }}-lein-maven-editor-${{ hashFiles('editor/scripts/lein', 'editor/project.clj', 'editor/profiles.clj') }}", restore-keys: "${{ runner.os }}-${{ matrix.platform || 'x86_64-linux' }}-lein-maven-editor-\n${{ runner.os }}-lein-maven-editor-\n${{ runner.os }}-${{ matrix.platform || 'x86_64-linux' }}-lein-editor-\n${{ runner.os }}-lein-editor-" } }, # v5.0.5
      { name: 'Install Python', uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405, with: { python-version: 3.13} }, # v6.2.0
      { name: 'Install Java', uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654, with: { java-version: '25', distribution: 'temurin', cache: "${{ github.event.action == 'contrib-build' && '' || 'gradle' }}", cache-dependency-path: "com.dynamo.cr/com.dynamo.cr.bob/*.gradle\ncom.dynamo.cr/com.dynamo.cr.bob/gradle/wrapper/gradle-wrapper.properties\ncom.dynamo.cr/com.dynamo.cr.bob.test/*.gradle\ncom.dynamo.cr/com.dynamo.cr.bob.test/gradle/wrapper/gradle-wrapper.properties"} }, # v5.2.0
      {
        name: 'Download bob jar',
        if: (github.event_name != 'repository_dispatch') || ((github.event_name == 'repository_dispatch') && (github.event.client_payload.skip_bob != true)),
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131, # v7.0.0
        with: {
          name: 'bob-jar',
          path: '${{ github.workspace }}/com.dynamo.cr/com.dynamo.cr.bob/dist'
        }
      },
      { name: 'Install dependencies', run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libglw1-mesa-dev freeglut3-dev },
      {
        name: 'Download engine build',
        # A contrib build has no S3 credentials, so the editor is packed from the engine
        # binaries in $DYNAMO_HOME (--engine-artifacts=dynamo-home) rather than from the
        # archive, and --skip-distclean keeps them from being wiped.
        if: github.event.action == 'contrib-build',
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131, # v7.0.0
        with: {
          name: "dynamo-home-${{ matrix.platform || 'x86_64-linux' }}",
          path: 'tmp/dynamo_home'
        }
      },
      {
        name: 'Test editor',
        run: 'ci/ci.sh test-editor --platform=x86_64-linux ${{ env.OPTION_EDITOR_LOCAL }}'
      },
      { name: 'Remove generated Bob artifact from Maven cache', shell: bash, run: 'rm -rf editor/.m2/repository/com/defold/lib/bob' },
      {
        name: 'Notify if build status changed',
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc, # v3.0.5
        if: "failure() && github.event.action != 'contrib-build' && contains('|dev|beta|master|refs/heads/dev|refs/heads/beta|refs/heads/master|', format('|{0}|', github.event.client_payload.branch || github.ref))",
        with: { webhook: '${{ env.SLACK_WEBHOOK }}', webhook-type: incoming-webhook, errors: true,
                payload: '{"channel":"#defold-alarms-build","text":"<!here> *${{ job.status }}*: ${{ github.workflow }} / ${{ github.job }}${{ matrix.platform && format('' / {0}'', matrix.platform) || '''' }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open run> · <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"}' }
      }
    ]

  release:
    needs: [build-editor, test-editor-linux, test-bob]
    runs-on: ubuntu-22.04
    # ci.py already refuses to release a branch other than master/beta/dev, but a contrib
    # branch must not even reach the release job.
    if: github.event.action != 'contrib-build'
    permissions:
      contents: write
    steps: [
      {
        name: 'Checkout CI scripts',
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd, # v6.0.2
        with: {
          ref: '${{env.BUILD_BRANCH}}',
          path: ci-check,
          sparse-checkout: 'ci'
        }
      },
      {
        name: 'Check release branch',
        id: release,
        run: "echo \"should_release=$(python3 ci-check/ci/ci.py should-release)\" >> \"$GITHUB_OUTPUT\"\necho \"requires_release_notes=$(python3 ci-check/ci/ci.py requires-release-notes)\" >> \"$GITHUB_OUTPUT\""
      },
      {
        name: 'Checkout',
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd, # v6.0.2
        if: &should_release steps.release.outputs.should_release == 'true',
        with: {
          ref: '${{env.BUILD_BRANCH}}',
          fetch-tags: true
        }
      },
      { name: 'Cache Defold downloads', if: *should_release, uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae, with: { path: '~/.dcache', key: "${{ runner.os }}-${{ matrix.platform || 'default' }}-dcache-${{ hashFiles('build_tools/sdk.py', 'editor/tasks/leiningen/sass.clj') }}", restore-keys: "${{ runner.os }}-${{ matrix.platform || 'default' }}-dcache-\n${{ runner.os }}-dcache-" } }, # v5.0.5
      { name: 'Install Python', if: *should_release, uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405, with: { python-version: 3.13} }, # v6.2.0
      { name: 'Setup git user', if: *should_release, run: 'git config --global user.email "services@defold.se" && git config --global user.name "Defold Services"' },
      {
        name: 'Download release notes',
        if: steps.release.outputs.should_release == 'true' && steps.release.outputs.requires_release_notes == 'true',
        continue-on-error: true,
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131, # v7.0.0
        with: {
          name: 'release-notes',
          path: 'releasenotes'
        }
      },
      {
        name: 'Release',
        if: *should_release,
        run: 'ci/ci.sh release'
      },
      {
        name: 'Publish updated API ref',
        uses: defold/repository-dispatch@2d664dcc9f8090e4328d0c7f98aa483f832c80b3, # 1.2.1
        if: steps.release.outputs.should_release == 'true' && ((github.ref == 'refs/heads/master') || (github.ref == 'refs/heads/beta') || (github.ref == 'refs/heads/dev')),
        with: {
          repo: 'defold/defold.github.io',
          token: '${{ secrets.SERVICES_GITHUB_TOKEN }}',
          user: 'services@defold.se',
          action: 'refdoc'
        }
      },
      {
        name: 'Notify if build status changed',
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc, # v3.0.5
        if: "failure() && github.event.action != 'contrib-build' && contains('|dev|beta|master|refs/heads/dev|refs/heads/beta|refs/heads/master|', format('|{0}|', github.event.client_payload.branch || github.ref))",
        with: { webhook: '${{ env.SLACK_WEBHOOK }}', webhook-type: incoming-webhook, errors: true,
                payload: '{"channel":"#defold-alarms-build","text":"<!here> *${{ job.status }}*: ${{ github.workflow }} / ${{ github.job }}${{ matrix.platform && format('' / {0}'', matrix.platform) || '''' }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open run> · <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"}' }
      }]
