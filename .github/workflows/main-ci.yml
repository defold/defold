name: CI - Main

on:
  push:
    branches-ignore:
      - 'skip-ci-*'
      - 'DEFEDIT-*'
      # Mirrored external pull requests. They are built through the 'contrib-build'
      # repository_dispatch below, never from a push, so that the workflow definition
      # comes from the default branch and not from the pull request. See pr-ok-to-test.yml.
      - 'contrib/**'

  pull_request:
    types: [opened]

  repository_dispatch: {}

permissions:
  contents: read

# Re-labelling a pull request supersedes the build that is already running for it. Every
# other run gets a group of its own so that the trusted branches keep running in parallel.
concurrency:
  group: ${{ github.event.action == 'contrib-build' && format('main-ci-{0}', github.event.client_payload.branch) || format('main-ci-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event.action == 'contrib-build' }}

env:
  # A 'contrib-build' dispatch builds a mirrored external pull request (pr-ok-to-test.yml).
  # The code being built was not written by anyone with push access, so it must not see any
  # credential that can sign, publish or write anything. The build reads its SDK packages
  # from DM_PACKAGES_URL and produces GitHub Actions artifacts instead of S3 objects.
  # Redaction is not a control here - the build executes wscripts, CMakeLists, Gradle and
  # Clojure straight from the pull request - so the secrets are withheld outright.
  S3_ACCESS_KEY: ${{ github.event.action != 'contrib-build' && secrets.S3_ACCESS_KEY || '' }}
  S3_SECRET_KEY: ${{ github.event.action != 'contrib-build' && secrets.S3_SECRET_KEY || '' }}
  NOTARIZATION_USERNAME: ${{ github.event.action != 'contrib-build' && secrets.NOTARIZATION_USERNAME || '' }}
  NOTARIZATION_PASSWORD: ${{ github.event.action != 'contrib-build' && secrets.NOTARIZATION_PASSWORD || '' }}
  NOTARIZATION_ITC_PROVIDER: ${{ github.event.action != 'contrib-build' && secrets.NOTARIZATION_ITC_PROVIDER || '' }}
  DM_PACKAGES_URL: ${{ secrets.DM_PACKAGES_URL }}
  DM_ARCHIVE_DOMAIN: ${{ secrets.DM_ARCHIVE_DOMAIN }}
  DM_RELEASE_REPOSITORY: ${{ github.event.action != 'contrib-build' && secrets.DM_RELEASE_REPOSITORY || '' }}
  GCLOUD_EDITOR_SERVICE_KEY: ${{ github.event.action != 'contrib-build' && secrets.GCLOUD_EDITOR_SERVICE_KEY || '' }}
  MACOS_CERTIFICATE: ${{ github.event.action != 'contrib-build' && secrets.MACOS_CERTIFICATE || '' }}
  MACOS_CERTIFICATE_PASS: ${{ github.event.action != 'contrib-build' && secrets.MACOS_CERTIFICATE_PASS || '' }}
  BUILD_BRANCH: ${{ github.event.client_payload.branch || github.head_ref }}
  SERVICES_GITHUB_TOKEN: ${{ github.event.action != 'contrib-build' && secrets.SERVICES_GITHUB_TOKEN || '' }}
  DEFOLD_EDITOR_DISABLE_PERFORMANCE_TESTS: true
  SLACK_WEBHOOK: ${{ github.event.action != 'contrib-build' && secrets.SLACK_WEBHOOK || '' }}
  DOTNET_CHANNEL: 9.0.1xx
  # Shared by the Android SDK setup and the emulator the x86_64-android tests run on
  ANDROID_API_LEVEL: '36'
  DM_BOB_JAR: ${{ github.workspace }}/com.dynamo.cr/com.dynamo.cr.bob/dist/bob.jar
  OPTION_CODESIGN: ${{ github.event.action != 'contrib-build' && github.event.client_payload.skip_sign != true && github.event.client_payload.skip_sign != 'true' && '--codesign' || '' }}
  # A contrib build has no S3 credentials: it hands its output to the jobs downstream as
  # GitHub Actions artifacts instead of archiving it, and builds the editor and bob from
  # $DYNAMO_HOME rather than from the archive.
  OPTION_ARCHIVE: ${{ github.event.action != 'contrib-build' && '--archive' || '' }}
  OPTION_SKIP_ARCHIVE: ${{ github.event.action == 'contrib-build' && '--skip-archive' || '' }}
  OPTION_EDITOR_LOCAL: ${{ github.event.action == 'contrib-build' && '--engine-artifacts=dynamo-home --skip-distclean' || '' }}

jobs:
  # ---- BUILD ENGINE VERSIONS ------------------
  bld-eng-windows:
    strategy:
      matrix:
        platform: [win32, x86_64-win32]

    runs-on: windows-2025-vs2026
    if: github.event_name != 'pull_request' && ((github.event_name != 'repository_dispatch') || ((github.event_name == 'repository_dispatch') && (github.event.client_payload.skip_engine != true)))
    timeout-minutes: 30
    steps: [
      { name: 'Checkout', uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd, with: { ref: '${{env.BUILD_BRANCH}}' } }, # v6.0.2
      { name: 'Cache Defold downloads', if: github.event.action != 'contrib-build', uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae, with: { path: '~/.dcache', key: "${{ runner.os }}-${{ matrix.platform || 'default' }}-dcache-${{ hashFiles('build_tools/sdk.py', 'editor/tasks/leiningen/sass.clj') }}", restore-keys: "${{ runner.os }}-${{ matrix.platform || 'default' }}-dcache-\n${{ runner.os }}-dcache-" } }, # v5.0.5
      { name: 'Install Python', uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405, with: { python-version: 3.13} }, # v6.2.0
      { name: 'Install Java', uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654, with: { java-version: '25', distribution: 'temurin', cache: "${{ github.event.action == 'contrib-build' && '' || 'gradle' }}", cache-dependency-path: "com.dynamo.cr/com.dynamo.cr.bob/*.gradle\ncom.dynamo.cr/com.dynamo.cr.bob/gradle/wrapper/gradle-wrapper.properties\ncom.dynamo.cr/com.dynamo.cr.bob.test/*.gradle\ncom.dynamo.cr/com.dynamo.cr.bob.test/gradle/wrapper/gradle-wrapper.properties"} }, # v5.2.0
      { name: 'Install CMake', uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb }, # v4.3.4
      { name: 'Set up Google Cloud SDK', uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db, with: { version: 'latest' } }, # v3.0.1
      {
        name: 'Setup dotnet',
        id: setup_dotnet,
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7, # v5.2.0
        with: { dotnet-version: '${{ env.DOTNET_CHANNEL }}' }
      },
      {
        name: 'Pin dotnet SDK',
        shell: bash,
        run: 'echo "{\"sdk\":{\"version\":\"${{ steps.setup_dotnet.outputs.dotnet-version }}\"}}" > global.json'
      },
      {
        name: 'Install dependencies',
        shell: bash,
        run: 'ci/ci.sh install --platform=${{ matrix.platform }}'
      },
      {
        name: 'Build engine',
        shell: bash,
        run: 'ci/ci.sh engine --platform=${{ matrix.platform }} ${{ env.OPTION_ARCHIVE }} --skip-builtins --skip-docs ${{ env.OPTION_CODESIGN }} --gcloud-service-key="${{env.GCLOUD_EDITOR_SERVICE_KEY}}"'
      },
      {
        name: 'Upload engine build for the jobs downstream',
        # A contrib build has no S3 credentials, so bob and the editor pick the engine
        # up from here instead of from the archive. See pr-ok-to-test.yml.
        if: github.event.action == 'contrib-build',
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a, # v7.0.1
        with: {
          name: 'dynamo-home-${{ matrix.platform }}',
          path: "tmp/dynamo_home/bin\ntmp/dynamo_home/lib\ntmp/dynamo_home/share",
          if-no-files-found: 'error',
          retention-days: 1
        }
      },
      {
        name: 'Stop Gradle Daemon',
        run: '.\\com.dynamo.cr\\com.dynamo.cr.bob\\gradlew.bat --stop'
      },
      {
        name: 'Notify if build status changed',
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc, # v3.0.5
        if: "failure() && github.event.action != 'contrib-build' && contains('|dev|beta|master|refs/heads/dev|refs/heads/beta|refs/heads/master|', format('|{0}|', github.event.client_payload.branch || github.ref))",
        with: { webhook: '${{ env.SLACK_WEBHOOK }}', webhook-type: incoming-webhook, errors: true,
                payload: '{"channel":"#defold-alarms-build","text":"<!here> *${{ job.status }}*: ${{ github.workflow }} / ${{ github.job }}${{ matrix.platform && format('' / {0}'', matrix.platform) || '''' }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open run> · <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"}' }
      }]

  bld-eng-darwin:
    strategy:
      matrix:
        include:
          - platform: x86_64-macos
          - platform: arm64-macos
          - platform: arm64-ios
            skip_tests: true
          - platform: x86_64-ios
            skip_tests: true
    runs-on: macos-26
    if: github.event_name != 'pull_request' && ((github.event_name != 'repository_dispatch') || ((github.event_name == 'repository_dispatch') && (github.event.client_payload.skip_engine != true)))
    timeout-minutes: 30
    steps: [
      { name: 'Checkout', uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd, with: { ref: '${{env.BUILD_BRANCH}}' } }, # v6.0.2
      { name: 'Cache Defold downloads', if: github.event.action != 'contrib-build', uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae, with: { path: '~/.dcache', key: "${{ runner.os }}-${{ matrix.platform || 'default' }}-dcache-${{ hashFiles('build_tools/sdk.py', 'editor/tasks/leiningen/sass.clj') }}", restore-keys: "${{ runner.os }}-${{ matrix.platform || 'default' }}-dcache-\n${{ runner.os }}-dcache-" } }, # v5.0.5
      { name: 'Install Python', uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405, with: { python-version: 3.13} }, # v6.2.0
      { name: 'XCode', uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90, with: { xcode-version: '26.5.0' } }, # v1.7.0
      { name: 'Install Java', uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654, with: { java-version: '25', distribution: 'temurin', cache: "${{ github.event.action == 'contrib-build' && '' || 'gradle' }}", cache-dependency-path: "com.dynamo.cr/com.dynamo.cr.bob/*.gradle\ncom.dynamo.cr/com.dynamo.cr.bob/gradle/wrapper/gradle-wrapper.properties\ncom.dynamo.cr/com.dynamo.cr.bob.test/*.gradle\ncom.dynamo.cr/com.dynamo.cr.bob.test/gradle/wrapper/gradle-wrapper.properties"} }, # v5.2.0
      { name: 'Install CMake', uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb }, # v4.3.4
      {
        name: 'Setup dotnet',
        id: setup_dotnet,
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7, # v5.2.0
        with: { dotnet-version: '${{ env.DOTNET_CHANNEL }}' }
      },
      {
        name: 'Pin dotnet SDK',
        shell: bash,
        run: 'echo "{\"sdk\":{\"version\":\"${{ steps.setup_dotnet.outputs.dotnet-version }}\"}}" > global.json'
      },
      {
        name: 'Install dependencies',
        run: 'ci/ci.sh install --keychain-cert="${{env.MACOS_CERTIFICATE}}" --keychain-cert-pass="${{env.MACOS_CERTIFICATE_PASS}}"'
      },
      {
        name: 'Build engine',
        run: 'extra_tests=""; if [ "${{ matrix.skip_tests }}" = "true" ]; then extra_tests="--skip-tests"; fi; ci/ci.sh engine --platform=${{ matrix.platform }} ${{ env.OPTION_ARCHIVE }} ${extra_tests} --skip-builtins --skip-docs ${{ env.OPTION_CODESIGN }}'
      },
      {
        name: 'Upload engine build for the jobs downstream',
        # A contrib build has no S3 credentials, so bob and the editor pick the engine
        # up from here instead of from the archive. See pr-ok-to-test.yml.
        if: github.event.action == 'contrib-build',
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a, # v7.0.1
        with: {
          name: 'dynamo-home-${{ matrix.platform }}',
          path: "tmp/dynamo_home/bin\ntmp/dynamo_home/lib\ntmp/dynamo_home/share",
          if-no-files-found: 'error',
          retention-days: 1
        }
      },
      {
        name: 'Stop Gradle Daemon',
        run: 'com.dynamo.cr/com.dynamo.cr.bob/gradlew --stop'
      },
      {
        name: 'Notify if build status changed',
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc, # v3.0.5
        if: "failure() && github.event.action != 'contrib-build' && contains('|dev|beta|master|refs/heads/dev|refs/heads/beta|refs/heads/master|', format('|{0}|', github.event.client_payload.branch || github.ref))",
        with: { webhook: '${{ env.SLACK_WEBHOOK }}', webhook-type: incoming-webhook, errors: true,
                payload: '{"channel":"#defold-alarms-build","text":"<!here> *${{ job.status }}*: ${{ github.workflow }} / ${{ github.job }}${{ matrix.platform && format('' / {0}'', matrix.platform) || '''' }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open run> · <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"}' }
      }]

  bld-eng-web:
    strategy:
      matrix:
        platform: [wasm-web, wasm_pthread-web]
    runs-on: ubuntu-22.04
    if: github.event_name != 'pull_request' && ((github.event_name != 'repository_dispatch') || ((github.event_name == 'repository_dispatch') && (github.event.client_payload.skip_engine != true)))
    timeout-minutes: 45
    steps: [
      { name: 'Checkout', uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd, with: { ref: '${{env.BUILD_BRANCH}}' } }, # v6.0.2
      { name: 'Cache Defold downloads', if: github.event.action != 'contrib-build', uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae, with: { path: '~/.dcache', key: "${{ runner.os }}-${{ matrix.platform || 'default' }}-dcache-${{ hashFiles('build_tools/sdk.py', 'editor/tasks/leiningen/sass.clj') }}", restore-keys: "${{ runner.os }}-${{ matrix.platform || 'default' }}-dcache-\n${{ runner.os }}-dcache-" } }, # v5.0.5
      { name: 'Install Python', uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405, with: { python-version: 3.13} }, # v6.2.0
      { name: 'Install Java', uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654, with: { java-version: '25', distribution: 'temurin', cache: "${{ github.event.action == 'contrib-build' && '' || 'gradle' }}", cache-dependency-path: "com.dynamo.cr/com.dynamo.cr.bob/*.gradle\ncom.dynamo.cr/com.dynamo.cr.bob/gradle/wrapper/gradle-wrapper.properties\ncom.dynamo.cr/com.dynamo.cr.bob.test/*.gradle\ncom.dynamo.cr/com.dynamo.cr.bob.test/gradle/wrapper/gradle-wrapper.properties"} }, # v5.2.0
      { name: 'Install CMake', uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb }, # v4.3.4
      { name: 'Setup emsdk', uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984, with: {version: '4.0.6'}}, # v16
      { name: 'Verify emsdk',
        run: 'emcc -v && export | grep EM'
      },
      { name: 'Install LLVM and Clang', uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0, with: {version: "13.0"}}, # v2.0.9
      { name: 'Install dependencies', run: 'ci/ci.sh install --platform=${{ matrix.platform }}' },
      {
        name: 'Build engine',
        run: 'ci/ci.sh engine --platform=${{ matrix.platform }} ${{ env.OPTION_ARCHIVE }} --skip-builtins --skip-docs --skip-tests'
      },
      {
        name: 'Upload engine build for the jobs downstream',
        # A contrib build has no S3 credentials, so bob and the editor pick the engine
        # up from here instead of from the archive. See pr-ok-to-test.yml.
        if: github.event.action == 'contrib-build',
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a, # v7.0.1
        with: {
          name: 'dynamo-home-${{ matrix.platform }}',
          path: "tmp/dynamo_home/bin\ntmp/dynamo_home/lib\ntmp/dynamo_home/share",
          if-no-files-found: 'error',
          retention-days: 1
        }
      },
      { name: 'Stop Gradle Daemon', run: 'com.dynamo.cr/com.dynamo.cr.bob/gradlew --stop' },
      {
        name: 'Notify if build status changed',
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc, # v3.0.5
        if: "failure() && github.event.action != 'contrib-build' && contains('|dev|beta|master|refs/heads/dev|refs/heads/beta|refs/heads/master|', format('|{0}|', github.event.client_payload.branch || github.ref))",
        with: { webhook: '${{ env.SLACK_WEBHOOK }}', webhook-type: incoming-webhook, errors: true,
                payload: '{"channel":"#defold-alarms-build","text":"<!here> *${{ job.status }}*: ${{ github.workflow }} / ${{ github.job }}${{ matrix.platform && format('' / {0}'', matrix.platform) || '''' }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open run> · <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"}' }
      }]

  bld-eng-android:
    strategy:
      matrix:
        include:
          - platform: armv7-android
            skip_tests: true
          - platform: arm64-android
            skip_tests: true
          # Without skip_tests the unit tests run on a hardware accelerated emulator, see below
          - platform: x86_64-android
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && ((github.event_name != 'repository_dispatch') || ((github.event_name == 'repository_dispatch') && (github.event.client_payload.skip_engine != true)))
    timeout-minutes: 60
    steps: [
      { name: 'Checkout', uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd, with: { ref: '${{env.BUILD_BRANCH}}' } }, # v6.0.2
      { name: 'Cache Defold downloads', if: github.event.action != 'contrib-build', uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae, with: { path: '~/.dcache', key: "${{ runner.os }}-${{ matrix.platform || 'default' }}-dcache-${{ hashFiles('build_tools/sdk.py', 'editor/tasks/leiningen/sass.clj') }}", restore-keys: "${{ runner.os }}-${{ matrix.platform || 'default' }}-dcache-\n${{ runner.os }}-dcache-" } }, # v5.0.5
      { name: 'Install Python', uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405, with: { python-version: 3.13} }, # v6.2.0
      { name: 'Install Java', uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654, with: { java-version: '25', distribution: 'temurin', cache: "${{ github.event.action == 'contrib-build' && '' || 'gradle' }}", cache-dependency-path: "com.dynamo.cr/com.dynamo.cr.bob/*.gradle\ncom.dynamo.cr/com.dynamo.cr.bob/gradle/wrapper/gradle-wrapper.properties\ncom.dynamo.cr/com.dynamo.cr.bob.test/*.gradle\ncom.dynamo.cr/com.dynamo.cr.bob.test/gradle/wrapper/gradle-wrapper.properties"} }, # v5.2.0
      { name: 'Install CMake', uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb }, # v4.3.4
      {
        name: 'Set up Android SDK',
        uses: defold/github-actions-common/.github/actions/android@8f32dd1cabf08f349200dd0135d07afc233fc322, # untagged pinned SHA
        with: {
          android-ndk: '25.2.9519653',
          android-api-level: '${{ env.ANDROID_API_LEVEL }}',
          android-build-tools: '36.1.0'
        }
      },
      { name: 'Install dependencies', run: 'ci/ci.sh install --platform=${{ matrix.platform }}' },
      {
        name: 'Enable KVM',
        if: "!matrix.skip_tests",
        run: "echo 'KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules\nsudo udevadm control --reload-rules\nsudo udevadm trigger --name-match=kvm"
      },
      {
        name: 'Cache Android AVD',
        if: "!matrix.skip_tests && github.event.action != 'contrib-build'",
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae, # v5.0.5
        with: { path: "~/.android/avd/*\n~/.android/adb*", key: "${{ runner.os }}-avd-${{ env.ANDROID_API_LEVEL }}-google_apis-x86_64" }
      },
      {
        name: 'Build engine and run tests on emulator',
        if: "!matrix.skip_tests",
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d, # v2.38.0
        with: {
          api-level: '${{ env.ANDROID_API_LEVEL }}',
          target: google_apis, # it's mandatory to use 'google_apis' instead of google play build because the seond one requires "USB debug authorization"
          arch: x86_64,
          force-avd-creation: false,
          disable-animations: true,
          emulator-options: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none -camera-front none',
          # The unit tests are run inline by waf, per engine library, so the emulator has
          # to stay up for the whole build. ANDROID_SERIAL points both the ABI check in
          # build_android.py and the adb test harness at it. Without a device those would
          # quietly fall back to --skip-tests, so bail out instead of building for nothing.
          script: "ANDROID_SERIAL=$(adb devices | awk '$2==\"device\"{print $1; exit}')\nif [ -z \"$ANDROID_SERIAL\" ]; then echo 'No Android device attached, refusing to skip the tests silently'; exit 1; fi\nexport ANDROID_SERIAL\necho \"Running ${{ matrix.platform }} tests on $ANDROID_SERIAL\"\nci/ci.sh engine --platform=${{ matrix.platform }} ${{ env.OPTION_ARCHIVE }} --skip-builtins --skip-docs"
        }
      },
      {
        name: 'Build engine',
        if: matrix.skip_tests,
        run: 'ci/ci.sh engine --platform=${{ matrix.platform }} ${{ env.OPTION_ARCHIVE }} --skip-tests --skip-builtins --skip-docs'
      },
      {
        name: 'Upload engine build for the jobs downstream',
        # A contrib build has no S3 credentials, so bob and the editor pick the engine
        # up from here instead of from the archive. See pr-ok-to-test.yml.
        if: github.event.action == 'contrib-build',
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a, # v7.0.1
        with: {
          name: 'dynamo-home-${{ matrix.platform }}',
          path: "tmp/dynamo_home/bin\ntmp/dynamo_home/lib\ntmp/dynamo_home/share",
          if-no-files-found: 'error',
          retention-days: 1
        }
      },
      { name: 'Stop Gradle Daemon', run: 'com.dynamo.cr/com.dynamo.cr.bob/gradlew --stop' },
      {
        name: 'Notify if build status changed',
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc, # v3.0.5
        if: "failure() && github.event.action != 'contrib-build' && contains('|dev|beta|master|refs/heads/dev|refs/heads/beta|refs/heads/master|', format('|{0}|', github.event.client_payload.branch || github.ref))",
        with: { webhook: '${{ env.SLACK_WEBHOOK }}', webhook-type: incoming-webhook, errors: true,
                payload: '{"channel":"#defold-alarms-build","text":"<!here> *${{ job.status }}*: ${{ github.workflow }} / ${{ github.job }}${{ matrix.platform && format('' / {0}'', matrix.platform) || '''' }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open run> · <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"}' }
