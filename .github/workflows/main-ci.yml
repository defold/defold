name: CI - Main

on:
  workflow_dispatch: {}

permissions:
  contents: read

# Re-labelling a pull request supersedes the build that is already running for it. Every
# other run gets a group of its own so that the trusted branches keep running in parallel.
concurrency:
  group: ${{ (startsWith(github.ref, 'refs/heads/contrib/') || startsWith(github.event.client_payload.branch, 'contrib/') || startsWith(github.head_ref, 'contrib/')) && format('main-ci-{0}', github.ref) || format('main-ci-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ (startsWith(github.ref, 'refs/heads/contrib/') || startsWith(github.event.client_payload.branch, 'contrib/') || startsWith(github.head_ref, 'contrib/')) }}

env:
  # A run on contrib/** builds a mirrored external pull request (pr-ok-to-test.yml).
  # The code being built was not written by anyone with push access, so it must not see any
  # credential that can sign, publish or write anything. The build reads its SDK packages
  # from DM_PACKAGES_URL and produces GitHub Actions artifacts instead of S3 objects.
  # Redaction is not a control here - the build executes CMakeLists, Gradle and
  # Clojure straight from the pull request - so the secrets are withheld outright.
  #
  # Untrusted is decided by the branch being built, not by the event: the three terms are
  # the three ways BUILD_BRANCH can be set. All come from the event, so no job can rewrite
  # them through $GITHUB_ENV the way it could a workflow-level env var.
  S3_ACCESS_KEY: ${{ !(startsWith(github.ref, 'refs/heads/contrib/') || startsWith(github.event.client_payload.branch, 'contrib/') || startsWith(github.head_ref, 'contrib/')) && secrets.S3_ACCESS_KEY || '' }}
  S3_SECRET_KEY: ${{ !(startsWith(github.ref, 'refs/heads/contrib/') || startsWith(github.event.client_payload.branch, 'contrib/') || startsWith(github.head_ref, 'contrib/')) && secrets.S3_SECRET_KEY || '' }}
  NOTARIZATION_USERNAME: ${{ !(startsWith(github.ref, 'refs/heads/contrib/') || startsWith(github.event.client_payload.branch, 'contrib/') || startsWith(github.head_ref, 'contrib/')) && secrets.NOTARIZATION_USERNAME || '' }}
  NOTARIZATION_PASSWORD: ${{ !(startsWith(github.ref, 'refs/heads/contrib/') || startsWith(github.event.client_payload.branch, 'contrib/') || startsWith(github.head_ref, 'contrib/')) && secrets.NOTARIZATION_PASSWORD || '' }}
  NOTARIZATION_ITC_PROVIDER: ${{ !(startsWith(github.ref, 'refs/heads/contrib/') || startsWith(github.event.client_payload.branch, 'contrib/') || startsWith(github.head_ref, 'contrib/')) && secrets.NOTARIZATION_ITC_PROVIDER || '' }}
  DM_PACKAGES_URL: ${{ secrets.DM_PACKAGES_URL }}
  DM_ARCHIVE_DOMAIN: ${{ secrets.DM_ARCHIVE_DOMAIN }}
  DM_RELEASE_REPOSITORY: ${{ !(startsWith(github.ref, 'refs/heads/contrib/') || startsWith(github.event.client_payload.branch, 'contrib/') || startsWith(github.head_ref, 'contrib/')) && secrets.DM_RELEASE_REPOSITORY || '' }}
  GCLOUD_EDITOR_SERVICE_KEY: ${{ !(startsWith(github.ref, 'refs/heads/contrib/') || startsWith(github.event.client_payload.branch, 'contrib/') || startsWith(github.head_ref, 'contrib/')) && secrets.GCLOUD_EDITOR_SERVICE_KEY || '' }}
  MACOS_CERTIFICATE: ${{ !(startsWith(github.ref, 'refs/heads/contrib/') || startsWith(github.event.client_payload.branch, 'contrib/') || startsWith(github.head_ref, 'contrib/')) && secrets.MACOS_CERTIFICATE || '' }}
  MACOS_CERTIFICATE_PASS: ${{ !(startsWith(github.ref, 'refs/heads/contrib/') || startsWith(github.event.client_payload.branch, 'contrib/') || startsWith(github.head_ref, 'contrib/')) && secrets.MACOS_CERTIFICATE_PASS || '' }}
  # ref_name only for a dispatch: for a pull request it is '<n>/merge', not a branch.
  BUILD_BRANCH: ${{ github.event.client_payload.branch || (github.event_name == 'workflow_dispatch' && github.ref_name) || github.head_ref }}
  # Reuse the event commit in every checkout. A repository dispatch must supply its
  # own SHA because github.sha identifies the default branch for that event.
  # Keep a missing dispatch SHA empty so validation fails before any checkout.
  BUILD_SHA: &build_sha "${{ (github.event_name == 'repository_dispatch' && github.event.client_payload.sha) || (github.event_name != 'repository_dispatch' && (github.event.pull_request.head.sha || github.sha)) || '' }}"
  SERVICES_GITHUB_TOKEN: ${{ !(startsWith(github.ref, 'refs/heads/contrib/') || startsWith(github.event.client_payload.branch, 'contrib/') || startsWith(github.head_ref, 'contrib/')) && secrets.SERVICES_GITHUB_TOKEN || '' }}
  DEFOLD_EDITOR_DISABLE_PERFORMANCE_TESTS: true
  SLACK_WEBHOOK: ""
  # Use the same SDK on every platform. Bumping this version also creates a new
  # cache for the installed SDK, including its runtime packs.
  DOTNET_SDK_VERSION: 9.0.121
  # Shared by the Android SDK setup and the emulator the x86_64-android tests run on
  ANDROID_API_LEVEL: "36"
  DM_BOB_JAR: ${{ github.workspace }}/com.dynamo.cr/com.dynamo.cr.bob/dist/bob.jar
  OPTION_CODESIGN: ""
  # A contrib build has no S3 credentials: it hands its output to the jobs downstream as
  # GitHub Actions artifacts instead of archiving it, and builds the editor and bob from
  # $DYNAMO_HOME rather than from the archive.
  OPTION_ARCHIVE: ""
  OPTION_SKIP_ARCHIVE: ${{ (startsWith(github.ref, 'refs/heads/contrib/') || startsWith(github.event.client_payload.branch, 'contrib/') || startsWith(github.head_ref, 'contrib/')) && '--skip-archive' || '' }}
  OPTION_EDITOR_LOCAL: ${{ (startsWith(github.ref, 'refs/heads/contrib/') || startsWith(github.event.client_payload.branch, 'contrib/') || startsWith(github.head_ref, 'contrib/')) && '--engine-artifacts=dynamo-home' || '' }}

jobs:
  # Steps and conditions that several jobs share are written once, with a YAML anchor
  # (&name), and referenced everywhere else with an alias (*name). Aliases are resolved
  # when the workflow is parsed, so an alias is exactly the block it points at - edit the
  # definition and every job that references it changes. Merge keys (<<:) are NOT supported
  # by GitHub and must not be used; an alias cannot be overridden, so a step that needs to
  # differ has to be written out in full.
  #
  #   &if_bob_enabled &should_release &build_sha &step_validate_build_commit
  #   &step_checkout &step_dcache_key &step_cache_dcache &step_cache_lein &step_python &step_java &step_cmake &step_linux_clang &step_build_external
  #   &step_download_bob &step_download_dynamo_home &step_download_engine_share &step_chmod_dynamo_home
  #   &step_remove_bob_maven &step_stop_gradle &step_notify
  #
  # Each is defined at its first use; grep for '&<name>' to find it.

  # ---- BUILD ENGINE VERSIONS ------------------
  bld-eng:
    # One job for every engine platform. A row is a platform: its runner, its timeout, the
    # extra ci.sh flags it needs, and flags selecting the toolchains to install. The check
    # names are pinned to the ones the separate bld-eng-* jobs produced, so branch
    # protection keeps working.
    #
    # fail-fast is off. Previously each platform group was its own matrix, so a failure
    # cancelled the siblings in that group only; with one matrix, fail-fast would cancel
    # every platform instead. Letting them all finish reports every platform on a bad
    # commit at the cost of the minutes a cancel would have saved.
    name: "${{ matrix.name }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "bld-eng-windows (x86_64-win32)"
            platform: x86_64-win32
            runner: windows-2025-vs2026
            timeout: 30
            engine_args: "--skip-builtins --skip-docs"
            dotnet: true
            gcloud: true
            codesign: false
    runs-on: ${{ matrix.runner }}
    if: github.event_name != 'pull_request' && ((github.event_name != 'repository_dispatch') || ((github.event_name == 'repository_dispatch') && (github.event.client_payload.skip_engine != true)))
    timeout-minutes: ${{ matrix.timeout }}
    # The Windows steps all declared shell: bash already.
    defaults:
      run:
        shell: bash
    steps:
      - &step_validate_build_commit
        name: "Validate build commit"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILD_SHA: *build_sha
        with:
          script: |
            const sha = process.env.BUILD_SHA;
            if (!sha || sha.length !== 40 || !/^[0-9a-f]+$/.test(sha)) {
              core.setFailed('A full build commit SHA is required. repository_dispatch must include client_payload.sha.');
              return;
            }
            if (context.eventName !== 'repository_dispatch') return;

            const branch = context.payload.client_payload?.branch;
            if (typeof branch !== 'string' || !branch) {
              core.setFailed('repository_dispatch must include client_payload.branch.');
              return;
            }
            if (!['master', 'beta', 'dev'].includes(branch)) return;

            // Validate release ancestry before checking out or running the selected code.
            // Resolve heads explicitly so a tag with the same name cannot authorize a release.
            const {data: ref} = await github.rest.git.getRef({
              ...context.repo, ref: `heads/${branch}`
            });
            const {data: comparison} = await github.request('GET /repos/{owner}/{repo}/compare/{basehead}', {
              ...context.repo, basehead: `${sha}...${ref.object.sha}`, per_page: 1
            });
            // The branch tip may have advanced since dispatch; the pinned SHA must
            // still be an ancestor of that tip, or the tip itself.
            if (!['ahead', 'identical'].includes(comparison.status)) {
              core.setFailed(`Dispatched commit ${sha} is not in the history of release branch ${branch}.`);
            }
      - &step_checkout
        name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: *build_sha
      - &step_python
        name: "Install Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13
      - &step_dcache_key
        name: "Read dependency cache key"
        id: dcache-key
        # No cache for a contrib build, and none for a repository dispatch: that always
        # reports github.ref as the default branch, so it would cache into another's scope.
        if: &if_dcache_enabled "!(startsWith(github.ref, 'refs/heads/contrib/') || startsWith(github.event.client_payload.branch, 'contrib/') || startsWith(github.head_ref, 'contrib/')) && github.event_name != 'repository_dispatch'"
        shell: bash
        run: &dcache_key_command python ci/cache_key.py >> "$GITHUB_OUTPUT"
      - &step_cache_dcache
        name: "Cache Defold dependency downloads"
        if: *if_dcache_enabled
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache only reusable dependencies. Download helpers replace URL slashes
          # with hyphens in filenames; engine and other build downloads are omitted.
          path: &dcache_paths |-
            ~/.dcache/*-WindowsKits-*.tar.gz-*
            ~/.dcache/*-Microsoft-Visual-Studio-*.tar.gz-*
            ~/.dcache/defold-adoptium-temurin*-binaries-releases-download-*-OpenJDK*U-jdk_*
            ~/.dcache/github_com-sass-dart-sass-releases-download-*
            ~/.dcache/github_com-LuaLS-lua-language-server-releases-download-*
            ~/.dcache/repo1_maven_org-maven2-com-ibm-icu-icu4j-*.jar-*
            ~/.dcache/github_com-defold-template-empty-archive-*.zip-*
            !~/.dcache/*_tmp
          key: &dcache_key "${{ runner.os }}-${{ matrix.platform || 'default' }}-${{ steps.dcache-key.outputs.key }}"
      - name: "Cache lein installation and Maven dependencies for docs"
        if: matrix.docs && !(startsWith(github.ref, 'refs/heads/contrib/') || startsWith(github.event.client_payload.branch, 'contrib/') || startsWith(github.head_ref, 'contrib/')) && github.event_name != 'repository_dispatch'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |-
            editor/build/lein
            editor/.m2/repository
          key: "${{ runner.os }}-${{ matrix.platform || 'default' }}-lein-maven-docs-${{ hashFiles('editor/scripts/lein', 'editor/project.clj', 'editor/profiles.clj') }}"
          restore-keys: |-
            ${{ runner.os }}-${{ matrix.platform || 'default' }}-lein-maven-docs-
            ${{ runner.os }}-lein-maven-docs-
            ${{ runner.os }}-${{ matrix.platform || 'default' }}-lein-docs-
            ${{ runner.os }}-lein-docs-
      - name: "XCode"
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          # The runner reports build 27A9269 as 27.1.0/GM, despite the beta app path.
          xcode-version: "27.1.0"
      - name: "Install Rosetta for Intel macOS tests"
        if: matrix.platform == 'x86_64-macos'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - &step_java
        name: "Install Java"
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25.0.4+101.0.LTS"
          distribution: "temurin"
          # 'gradle' has to be the middle operand: in `a && b || c` an empty b is falsy.
          cache: "${{ (!(startsWith(github.ref, 'refs/heads/contrib/') || startsWith(github.event.client_payload.branch, 'contrib/') || startsWith(github.head_ref, 'contrib/')) && github.event_name != 'repository_dispatch') && 'gradle' || '' }}"
          cache-dependency-path: |-
            com.dynamo.cr/com.dynamo.cr.bob/*.gradle
            com.dynamo.cr/com.dynamo.cr.bob/gradle/wrapper/gradle-wrapper.properties
            com.dynamo.cr/com.dynamo.cr.bob.test/*.gradle
            com.dynamo.cr/com.dynamo.cr.bob.test/gradle/wrapper/gradle-wrapper.properties
      - &step_cmake
        name: "Install CMake"
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          # This action stores its CMake and Ninja download in the Actions cache by
          # default, under a key derived from the versions alone. A contrib build must
          # not write there - see the cache steps above.
          useCloudCache: ${{ !(startsWith(github.ref, 'refs/heads/contrib/') || startsWith(github.event.client_payload.branch, 'contrib/') || startsWith(github.head_ref, 'contrib/')) && github.event_name != 'repository_dispatch' }}
      - name: "Set up Google Cloud SDK"
        if: matrix.gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "latest"
      - name: "Setup emsdk"
        if: matrix.emsdk
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: "4.0.6"
      - name: "Verify emsdk"
        if: matrix.emsdk
        run: "emcc -v && export | grep EM"
      - name: "Setup Node for WASM tests"
        if: matrix.platform == 'wasm-web'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: "Set up Android SDK"
        if: matrix.android
        uses: ./.github/actions/setup-android
        with:
          android-ndk: "25.2.9519653"
          android-api-level: "${{ env.ANDROID_API_LEVEL }}"
          android-build-tools: "36.1.0"
          emulator: ${{ matrix.emulator == true }}
          # A contrib build must not write caches - see the cache steps above.
          cache: ${{ !(startsWith(github.ref, 'refs/heads/contrib/') || startsWith(github.event.client_payload.branch, 'contrib/') || startsWith(github.head_ref, 'contrib/')) && github.event_name != 'repository_dispatch' }}
      - name: "Cache dotnet SDK"
        if: "matrix.dotnet && !(startsWith(github.ref, 'refs/heads/contrib/') || startsWith(github.event.client_payload.branch, 'contrib/') || startsWith(github.head_ref, 'contrib/')) && github.event_name != 'repository_dispatch'"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache an isolated installation, without the runner image's other SDKs.
          path: "${{ runner.temp }}/defold-dotnet"
          # v2 drops the unrelated LTS runtime installed by setup-dotnet.
          key: "${{ runner.os }}-${{ runner.arch }}-dotnet-sdk-${{ env.DOTNET_SDK_VERSION }}-v2"
      - name: "Setup dotnet"
        if: matrix.dotnet
        env:
          DOTNET_INSTALL_DIR: "${{ runner.temp }}/defold-dotnet"
        # Run on cache hits too to set PATH and DOTNET_ROOT for subsequent steps.
        run: python ci/setup_dotnet.py
      - name: "Pin dotnet SDK"
        if: matrix.dotnet
        run: 'echo "{\"sdk\":{\"version\":\"${{ env.DOTNET_SDK_VERSION }}\"}}" > global.json'
      # macOS installs the signing certificate into the keychain instead of passing a platform.
      - name: "Install dependencies"
        if: runner.os == 'macOS'
        run: 'ci/ci.sh install --keychain-cert="${{env.MACOS_CERTIFICATE}}" --keychain-cert-pass="${{env.MACOS_CERTIFICATE_PASS}}"'
      - name: "Install dependencies"
        if: runner.os != 'macOS'
        run: "ci/ci.sh install --platform=${{ matrix.platform }}"
      - &step_linux_clang
        name: "Set up Linux Clang"
        if: runner.os == 'Linux'
        # Use the same compiler path for engine, Bob, and editor cache keys.
        run: |
          eval "$(python build_tools/set_sdk_vars.py VERSION_LINUX_CLANG)"
          LLVM_MAJOR="${VERSION_LINUX_CLANG%%.*}"
          if [ ! -x "/usr/lib/llvm-${LLVM_MAJOR}/bin/clang++" ]; then
            curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
            sudo bash "$RUNNER_TEMP/llvm.sh" "$LLVM_MAJOR"
          fi
          echo "/usr/lib/llvm-${LLVM_MAJOR}/bin" >> "$GITHUB_PATH"
      - &step_build_external
        name: "Build external dependencies"
        uses: ./.github/actions/build-external
        with:
          platform: ${{ matrix.platform || 'x86_64-linux' }}
          cache: ${{ !(startsWith(github.ref, 'refs/heads/contrib/') || startsWith(github.event.client_payload.branch, 'contrib/') || startsWith(github.head_ref, 'contrib/')) && github.event_name != 'repository_dispatch' }}
      - name: "Test build scripts"
        if: matrix.platform == 'x86_64-win32' || matrix.platform == 'arm64-macos' || matrix.platform == 'x86_64-linux' || matrix.platform == 'arm64-linux'
        run: |
          build_test_path="$PATH"
          source ci/env.sh
          export PATH="$PATH:$build_test_path"
          python -m unittest discover -s scripts -p 'test_build_*.py'
      - name: "Enable KVM"
        if: matrix.emulator
        run: |-
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: "Install pinned Lua language server for docs validation"
        if: matrix.docs
        run: 'python engine/docs/build_docs.py install-lua-language-server --project-clj editor/project.clj --platform ${{ matrix.platform }} --output-dir "$RUNNER_TEMP/defold-lua-language-server" --github-env "$GITHUB_ENV"'
      - name: "Build engine and run tests on emulator"
        if: matrix.emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: "${{ env.ANDROID_API_LEVEL }}"
          target: google_apis # it's mandatory to use 'google_apis' instead of google play build because the seond one requires "USB debug authorization"
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: "-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none -camera-front none"
          # The unit tests run during the engine build, so the emulator has
          # to stay up for the whole build. ANDROID_SERIAL points both the ABI check in
          # build_android.py and the adb test harness at it. Without a device those would
          # quietly fall back to --skip-tests, so bail out instead of building for nothing.
          script: |-
            ANDROID_SERIAL=$(adb devices | awk '$2=="device"{print $1; exit}')
            if [ -z "$ANDROID_SERIAL" ]; then echo 'No Android device attached, refusing to skip the tests silently'; exit 1; fi
            export ANDROID_SERIAL
            echo "Running ${{ matrix.platform }} tests on $ANDROID_SERIAL"
            ci/ci.sh engine --skip-install-ext --platform=${{ matrix.platform }} ${{ env.OPTION_ARCHIVE }} --skip-builtins --skip-docs
      # matrix.engine_args carries the per-platform flags; codesign and the gcloud key
      # come from env, which a matrix cannot reference, so they are appended here.
      - name: "Build engine"
        if: "!matrix.emulator"
        env:
          LIBGL_ALWAYS_SOFTWARE: ${{ runner.os == 'Linux' && '1' || '' }}
          GALLIUM_DRIVER: ${{ runner.os == 'Linux' && 'llvmpipe' || '' }}
        run: 'ci/ci.sh engine --skip-install-ext --platform=${{ matrix.platform }} ${{ env.OPTION_ARCHIVE }} ${{ matrix.engine_args }}${{ matrix.codesign && format('' {0}'', env.OPTION_CODESIGN) || '''' }}${{ matrix.gcloud && format('' --gcloud-service-key="{0}"'', env.GCLOUD_EDITOR_SERVICE_KEY) || '''' }}'
      # Run browser lifecycle tests separately while the regular engine tests are skipped.
      - name: "Install browser test dependencies"
        if: matrix.platform == 'wasm-web'
        working-directory: engine/platform/src/test/browser
        run: |
          npm ci
          npx playwright install --with-deps --no-shell chromium
      - name: "Run native window browser tests"
        if: matrix.platform == 'wasm-web'
        timeout-minutes: 5
        run: |
          source ci/env.sh
          cmake -S . -B engine/build/wasm-web -DBUILD_TESTS=ON
          xvfb-run --auto-servernum cmake --build engine/build/wasm-web --target run_test_native_web_browser
      - name: "Upload browser test results"
        if: "!cancelled() && matrix.platform == 'wasm-web'"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-window-browser-wasm-web
          path: |
            engine/platform/src/test/browser/playwright-report
            engine/platform/src/test/browser/test-results
          retention-days: 7
      - name: "Upload CMake build logs"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cmake-logs-${{ matrix.platform }}
          path: |
            engine/**/logs/*.log
            external/**/logs/*.log
          if-no-files-found: ignore
          retention-days: 7
      - &step_upload_gradle_logs
        name: "Upload Gradle build logs"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-logs-${{ github.job }}-${{ matrix.platform || 'host' }}
          path: com.dynamo.cr/**/logs/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: "Upload build reports"
        if: always() && runner.os == 'Linux' && endsWith(matrix.platform, '-linux')
        uses: ./.github/actions/upload-build-reports
        with:
          platform: ${{ matrix.platform }}
      - name: "Upload engine build for the jobs downstream"
        # A contrib build has no S3 credentials, so bob and the editor pick the engine
        # up from here instead of from the archive. See pr-ok-to-test.yml.
        if: (startsWith(github.ref, 'refs/heads/contrib/') || startsWith(github.event.client_payload.branch, 'contrib/') || startsWith(github.head_ref, 'contrib/'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "dynamo-home-${{ matrix.platform }}"
          path: |-
            tmp/dynamo_home/bin
            tmp/dynamo_home/lib
            tmp/dynamo_home/share
            tmp/dynamo_home/ext/bin/${{ matrix.platform }}/luajit-64*
          if-no-files-found: "error"
          retention-days: 1
      - name: "Upload docs and builtins for the editor jobs"
        if: matrix.docs && (startsWith(github.ref, 'refs/heads/contrib/') || startsWith(github.event.client_payload.branch, 'contrib/') || startsWith(github.head_ref, 'contrib/'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "engine-share"
          path: "tmp/dynamo_home/share"
          if-no-files-found: "error"
          retention-days: 1
      - name: "Stop Gradle Daemon"
        if: runner.os == 'Windows'
        shell: pwsh
        run: '.\\com.dynamo.cr\\com.dynamo.cr.bob\\gradlew.bat --stop'
      - name: "Stop Gradle Daemon"
        if: runner.os != 'Windows'
        run: "com.dynamo.cr/com.dynamo.cr.bob/gradlew --stop"
      - &step_notify
        name: "Notify if build status changed"
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        if: "failure() && !(startsWith(github.ref, 'refs/heads/contrib/') || startsWith(github.event.client_payload.branch, 'contrib/') || startsWith(github.head_ref, 'contrib/')) && contains('|dev|beta|master|refs/heads/dev|refs/heads/beta|refs/heads/master|', format('|{0}|', github.event.client_payload.branch || github.ref))"
        with:
          webhook: "${{ env.SLACK_WEBHOOK }}"
          webhook-type: incoming-webhook
          errors: true
          payload: '{"channel":"#defold-alarms-build","text":"<!here> *${{ job.status }}*: ${{ github.workflow }} / ${{ github.job }}${{ matrix.platform && format('' / {0}'', matrix.platform) || '''' }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open run> · <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"}'
