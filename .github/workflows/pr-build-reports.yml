name: PR Build Reports

on:
  workflow_run:
    workflows: ["CI - Main"]
    types: [completed]

# This workflow runs trusted default-branch code. Never check out the build's
# branch or download/execute its artifacts with this write-capable token.
permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: pr-build-reports-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Update Build Reports comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const {owner, repo} = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: run.id, per_page: 100
            });
            // Only use API metadata with a fixed artifact-name format, never
            // PR-provided Markdown or downloaded report contents.
            const reports = artifacts.filter(a => !a.expired &&
              new RegExp(`^build-reports-(x86_64|arm64)-linux-${run.run_attempt}$`).test(a.name));
            if (!reports.length) {
              core.info('No build reports were uploaded for this attempt. Download information remains in the engine job summary.');
              return;
            }
            reports.sort((a, b) => a.name.localeCompare(b.name));
            const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner, repo, commit_sha: run.head_sha, per_page: 100
            });
            const marker = '<!-- defold-font-build-reports -->';
            const body = [marker, '## Build Reports', '',
              `Build reports for ${run.head_sha.slice(0, 12)} · [CI run](${run.html_url})`, '',
              'Download the report files; HTML reports can be opened in your browser. Artifacts expire after 14 days.', ''];
            for (const artifact of reports) {
              const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${run.id}/artifacts/${artifact.id}`;
              body.push(`- [${artifact.name}](${url})`, '', '```sh',
                `gh run download ${run.id} --repo ${owner}/${repo} --name ${artifact.name} --dir build-reports/${artifact.name}`,
                '```', '');
            }
            for (const associated of pulls) {
              const {data: pull} = await github.rest.pulls.get({owner, repo, pull_number: associated.number});
              // Do not let a completed older build overwrite the current PR's report.
              if (pull.state !== 'open' || pull.head.sha !== run.head_sha) continue;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pull.number, per_page: 100
              });
              const previous = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
              if (previous) {
                await github.rest.issues.updateComment({owner, repo, comment_id: previous.id, body: body.join('\n')});
              } else {
                await github.rest.issues.createComment({owner, repo, issue_number: pull.number, body: body.join('\n')});
              }
            }
