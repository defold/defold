name: Build shader tools

on:
  push:
    branches:
      - shader-tools-shrinking
    paths:
      - .github/workflows/build-shader-tools.yml
      - share/ext/glslang/**
      - share/ext/spirv-tools/**
      - share/ext/spirv-cross/**
      - share/ext/tint/**
  workflow_dispatch:
    inputs:
      push_changes:
        type: boolean
        description: Commit all rebuilt packages and their version references to this branch
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Shader tools (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arm64-macos
            runner: macos-26
          - platform: x86_64-macos
            runner: macos-26
          - platform: arm64-linux
            runner: ubuntu-22.04-arm
          - platform: x86_64-linux
            runner: ubuntu-22.04
          - platform: x86_64-win32
            runner: windows-2025-vs2026
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      BUILD_PLATFORM: ${{ matrix.platform }}
      CMAKE_GENERATOR: Ninja
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: x64

      - name: Set up Linux Clang
        if: runner.os == 'Linux'
        run: |
          eval "$(python build_tools/set_sdk_vars.py VERSION_LINUX_CLANG)"
          LLVM_MAJOR="${VERSION_LINUX_CLANG%%.*}"
          if [ ! -x "/usr/lib/llvm-${LLVM_MAJOR}/bin/clang++" ]; then
            curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
            sudo bash "$RUNNER_TEMP/llvm.sh" "$LLVM_MAJOR"
          fi
          echo "/usr/lib/llvm-${LLVM_MAJOR}/bin" >> "$GITHUB_PATH"

      - name: Build release packages
        id: build_packages
        run: |
          set -euo pipefail
          export DEFOLD_HOME="$(pwd)"
          export DYNAMO_HOME="$DEFOLD_HOME/tmp/dynamo_home"
          if [ "$RUNNER_OS" == "Linux" ]; then
            export CC=clang CXX=clang++
          fi
          mkdir -p "$DYNAMO_HOME" "$RUNNER_TEMP/shader-packages"
          for tool in glslang spirv-tools spirv-cross tint; do
            (
              cd "share/ext/$tool"
              bash "build_${tool}.sh" "$BUILD_PLATFORM"
              cp build/*/"$BUILD_PLATFORM"/"$tool"-*-"$BUILD_PLATFORM".tar.gz "$RUNNER_TEMP/shader-packages/"
            )
          done

      - name: Smoke test GLSL to SPIR-V to WGSL
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/shader-smoke"
          mkdir -p "$smoke"
          for package in "$RUNNER_TEMP/shader-packages/"*.tar.gz; do
            # Reading stdin avoids treating a Windows drive letter as a remote host.
            tar -xzf - -C "$smoke" < "$package"
          done
          cat > "$smoke/test.vert" <<'GLSL'
          #version 450
          layout(location = 0) in vec4 position;
          layout(set = 0, binding = 0) uniform Constants { mat4 view_proj; };
          void main() { gl_Position = view_proj * position; }
          GLSL
          tool_bin="$smoke/bin/$BUILD_PLATFORM"
          suffix=""
          if [ "$RUNNER_OS" == "Windows" ]; then suffix=".exe"; fi
          "$tool_bin/glslang$suffix" -Od -V "$smoke/test.vert" -o "$smoke/test.spv"
          "$tool_bin/spirv-opt$suffix" -O "$smoke/test.spv" -o "$smoke/optimized.spv"
          "$tool_bin/tint$suffix" --format wgsl --allow-non-uniform-derivatives true "$smoke/optimized.spv" -o "$smoke/test.wgsl"
          test -s "$smoke/test.wgsl"

      - name: Archive packages
        if: ${{ !cancelled() && steps.build_packages.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shader-tools-${{ matrix.platform }}
          path: ${{ runner.temp }}/shader-packages/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  update-packages:
    if: ${{ inputs.push_changes && github.ref_type == 'branch' }}
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout built revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shader-tools-*
          path: packages
          merge-multiple: true

      - name: Update package references
        run: python3 share/ext/update_shader_tool_packages.py

      - name: Commit package updates
        env:
          BUILD_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.email "services@defold.se"
          git config user.name "Defold Services"
          git add packages/glslang-*.tar.gz packages/spirv-tools-*.tar.gz packages/spirv-cross-*.tar.gz packages/tint-*.tar.gz scripts/build.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "packages: update shader tools"
          git push origin "HEAD:refs/heads/$BUILD_BRANCH"
