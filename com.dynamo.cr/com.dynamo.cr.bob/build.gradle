tasks.register('createBobLightJar', Jar) {
    dependsOn 'compileBobLight', 'createLuaJitShareZip'
    dependsOn privateBobPluginJarTasks

    archiveFileName = 'bob-light.jar'
    destinationDirectory = file("${bobDir}/dist")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(classesDir) {
        include '**/*.class'
        exclude 'private_plugins/**'
    }
    from generatedClassesDir
    from bobLightResourceFiles
    bobArtifacts.entries.findAll { path, artifact -> artifact.light }.each { path, artifact ->
        from({ artifact.source.isFile() ? artifact.source : [] }) {
            into path.substring(0, path.lastIndexOf('/'))
            rename { path.substring(path.lastIndexOf('/') + 1) }
        }
    }
    from bobArtifacts.privateLightFiles
    doFirst { validateArtifacts(true) }

    from {
        bobDependencyJars.collect { zipTree(it) }
    } {
        exclude '**/META-INF/**'
    }

    inputs.files(bobDependencyJars)
    outputs.file("${bobDir}/dist/bob-light.jar")

    manifest {
        def attrs = [
                'Main-Class': 'com.dynamo.bob.Bob',
                'Enable-Native-Access': 'ALL-UNNAMED',
                'is-bob-light': 'true'
        ]
        if (privateBobPluginClassPath) {
            attrs['Class-Path'] = privateBobPluginClassPath
        }
        attributes attrs
    }

    doLast {
        def hostFontcLibraryNames = [
                'x86_64-macos': 'libfontc_shared.dylib',
                'arm64-macos': 'libfontc_shared.dylib',
                'x86_64-linux': 'libfontc_shared.so',
                'arm64-linux': 'libfontc_shared.so',
                'x86_64-win32': 'fontc_shared.dll'
        ]
        def hostFontcLibraryName = hostFontcLibraryNames[hostPlatform]
        if (!hostFontcLibraryName) {
            throw new GradleException("Unsupported host platform: ${hostPlatform}")
        }
        def hostFontcPath = "lib/${hostPlatform}/${hostFontcLibraryName}"
        def hasHostFontc = false
        new ZipFile(archiveFile.get().asFile).withCloseable { zipFile ->
            hasHostFontc = zipFile.getEntry(hostFontcPath) != null
        }
        if (!hasHostFontc) {
            throw new GradleException("bob-light.jar is missing the host font compiler library: ${hostFontcPath}")
        }
    }
}

