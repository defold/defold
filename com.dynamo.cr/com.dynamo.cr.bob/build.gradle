import java.util.zip.ZipFile
import groovy.json.JsonSlurper

interface ProtocBatchParameters extends WorkParameters {
    ListProperty<String> getArguments()
}

abstract class ProtocBatch implements WorkAction<ProtocBatchParameters> {
    @Inject
    abstract ExecOperations getExecOperations()

    @Override
    void execute() {
        def arguments = parameters.arguments.get()
        execOperations.exec { commandLine arguments }
    }
}

abstract class GenerateBobProtos extends DefaultTask {
    @Inject
    abstract WorkerExecutor getWorkerExecutor()
}

