def artifactFiles = {
    Map<String, File> result = [:]
    bobArtifacts.entries.each { path, artifact ->
        if (artifact.source.isFile()) {
            result[path] = artifact.source
        }
    }
    bobArtifacts.privateFiles.files.sort().each { source ->
        def path = bobDir.toPath().relativize(source.toPath()).toString().replace(File.separatorChar, '/' as char)
        if (!result.containsKey(path)) {
            result[path] = source
        }
    }
    result
}

def validateArtifacts = { boolean light ->
    def missing = bobArtifacts.entries.findAll { path, artifact ->
        def required = light ? path.startsWith('libexec/') && path.contains('/luajit-64') : artifact.required
        required && !artifact.source.isFile()
    }
    if (!missing.isEmpty()) {
        throw new GradleException("Missing Bob artifacts; install the external packages and build or sync the engine: " +
                missing.collect { path, artifact -> "${path}: ${artifact.source}" }.join(', '))
    }
}

def readGitRevision = { String repositoryRoot ->
    if (!repositoryRoot) {
        return ''
    }
    try {
        def stdout = new ByteArrayOutputStream()
        def result = services.get(ExecOperations).exec {
            commandLine 'git', '-C', repositoryRoot, 'rev-parse', 'HEAD'
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        return result.exitValue == 0 ? stdout.toString('UTF-8').trim() : 'unversioned'
    } catch (Exception ignored) {
        return 'unversioned'
    }
}

def bobBuildContext = [
        "bobRevision=${bobGitRevision}",
        "targetPlatform=${targetPlatform}",
        "dynamoHome=${file(dynamoHome).canonicalPath}",
        "privateRoot=${privatePlatformRoot}",
        "privateRevision=${readGitRevision(privatePlatformRoot)}",
        "privatePlugins=${privateBobPluginModules.collect { "${it.name}:${it.jarName}" }.sort().join(',')}"
].join('\n') + '\n'
