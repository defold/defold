def cleanTask = tasks.named('clean')
gradle.taskGraph.whenReady { graph ->
    // Resolve the actual graph so qualified/default tasks and -x clean work too.
    boolean cleanBuild = graph.hasTask(cleanTask.get())
    graph.allTasks.findAll { it instanceof JavaCompile }.each { task ->
        task.options.incremental = !cleanBuild
    }
}

tasks.register('execProtoTasks', GenerateBobProtos) {
    group = 'build'
    dependsOn 'prepareBobBuildContext'
}

tasks.named('compileJava') {
    dependsOn 'execProtoTasks'
}

gradle.projectsEvaluated {
    def protoSources = project.protoFiles.collect { proto -> file("${proto.dir}/${proto.file}") }
    def protoIncludeDirs = (project.protoFiles.collect { proto -> file(proto.dir) } + [
            file("${dynamoHome}/ext/include"), file('../../engine/gameobject/proto'),
            file('../../engine/script/src'), file('../../engine/ddf/src'), file('../../engine/graphics/proto')
    ]).unique()
    def generatedDir = file("${bobDir}/generated")
    def protocName = hostPlatform.endsWith('win32') ? 'protoc.exe' : 'protoc'
    def protoc = file("${dynamoHome}/ext/bin/${hostPlatform}/${protocName}")

    // Each batch generates different Java files. Use Gradle workers so these
    // processes run concurrently within one project and honor --max-workers.
    int batchCount = Math.max(1, Math.min(4, Math.min(gradle.startParameter.maxWorkerCount, protoSources.size())))
    def batches = (0..<batchCount).collect { [] }
    protoSources.eachWithIndex { source, index -> batches[index % batchCount].add(source.absolutePath) }
    def arguments = [protoc.absolutePath, "--java_out=${generatedDir}".toString()] +
            protoIncludeDirs.collect { "-I${it}".toString() }

    tasks.named('execProtoTasks') {
        inputs.files(protoSources).withPropertyName('protoSources')
        inputs.files(protoIncludeDirs.collect { dir -> fileTree(dir) { include '**/*.proto' } })
                .withPropertyName('protoImports').ignoreEmptyDirectories()
        inputs.file(protoc).withPropertyName('protoc')
        inputs.property('protoIncludeDirs', protoIncludeDirs.collect { it.absolutePath })
        outputs.dir(generatedDir)

        doLast {
            mkdir generatedDir
            def queue = workerExecutor.noIsolation()
            batches.findAll { !it.isEmpty() }.each { batch ->
                queue.submit(ProtocBatch) { parameters ->
                    parameters.arguments.set(arguments + batch)
                }
            }
            queue.await()
        }
    }
}

tasks.register('proto', Exec) {
    group = 'build'
    def protoDir = project.findProperty('protoDir') ?: ''
    def protoFile = project.findProperty('protoFile') ?: ''
    inputs.file("${protoDir}/${protoFile}")
    outputs.dir("${bobDir}/generated")
    doFirst {
        if (!protoDir || !protoFile) {
            throw new RuntimeException("Properties 'protoDir' and 'protoFile' must be specified")
        }
        mkdir "${bobDir}/generated"
        if (!hostPlatform) {
            throw new RuntimeException("hostPlatform is not set. Make sure 'getHostPlatform' task is executed.")
        }
        commandLine "${dynamoHome}/ext/bin/${hostPlatform}/protoc", "--java_out=${bobDir}/generated",
                "-I${protoDir}", "-I${dynamoHome}/ext/include", "-I../../engine/gameobject/proto",
                "-I../../engine/script/src", "-I../../engine/ddf/src", "-I../../engine/graphics/proto", "${protoDir}/${protoFile}"
    }
}

