buildscript {
    dependencies {
        def commonsCompressJars = fileTree("${gradle.gradleHomeDir}/lib") {
            include 'commons-compress-*.jar',
                    'commons-io-*.jar'
        }
        classpath files(commonsCompressJars)
    }
}

import org.apache.commons.compress.archivers.zip.ParallelScatterZipCreator
import org.apache.commons.compress.archivers.zip.Zip64Mode
import org.apache.commons.compress.archivers.zip.ZipArchiveEntry
import org.apache.commons.compress.archivers.zip.ZipArchiveOutputStream
import org.apache.commons.compress.parallel.InputStreamSupplier

import java.nio.file.AtomicMoveNotSupportedException
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.util.concurrent.Executors
import java.util.concurrent.TimeUnit
import java.util.jar.Attributes
import java.util.jar.Manifest
import java.util.zip.CRC32
import java.util.zip.ZipFile
import groovy.json.JsonSlurper

apply plugin: 'java'
gradle.startParameter.parallelProjectExecutionEnabled = true
apply from: '../com.dynamo.cr.bob/basic.gradle'

// Capture build settings during configuration; task actions must not access Task.project.
def bobDir = project.bobDir
def classesDir = project.classesDir
// Keep compiler outputs separate; classesDir includes the entire build directory.
def generatedClassesDir = file("${bobDir}/target/generated-classes")
def dynamoHome = file(project.dynamoHome)
def hostPlatform = project.hostPlatform
def python = project.python
def keepBobUncompressed = project.hasProperty('keep-bob-uncompressed')
def gradleVersion = gradle.gradleVersion

allprojects {
    tasks.withType(Jar).configureEach {
        exclude('tmp/**', 'reports/**')
        includeEmptyDirs = false
        if (project.hasProperty('keep-bob-uncompressed')) {
            entryCompression = ZipEntryCompression.STORED
        }
    }
    tasks.withType(Zip).configureEach {
        includeEmptyDirs = false
    }
    tasks.withType(Copy).configureEach {
        includeEmptyDirs = false
    }
    tasks.withType(JavaCompile).configureEach {
        options.incremental = true
    }
}

repositories {
    flatDir {
        dirs 'lib', "${bobDir}/lib", "${bobDir}/lib/aws"
    }
}

def bobLightDependencyJars = ['dlib.jar', 'fontrenderer.jar', 'modelimporter.jar', 'texturecompiler.jar', 'shaderc.jar']

tasks.register('cleanDirs', Delete) {
    delete classesDir
    delete file("${bobDir}/generated")
    delete file("${bobDir}/dist")
    delete file("${bobDir}/tmp")
    delete file("${bobDir}/target")
    delete file("${bobDir}/lib/luajit-share.zip")
}

tasks.named('clean') {
    dependsOn 'cleanDirs'
}

gradle.projectsEvaluated {
    project.protoFiles.each { proto ->
        def protoDir = file(proto.dir)
        def protoFilePath = file("${proto.dir}/${proto.file}")
        def protoTaskName = "protoTask_${proto.file.replace('/', '_').replace('.', '_')}" as String
        tasks.named('compileJava').configure {
            dependsOn protoTaskName
        }
        tasks.register(protoTaskName, Exec) {
            group = 'build'
            inputs.file(protoFilePath)
            outputs.dir("${bobDir}/generated")
            doFirst {
                if (!protoDir.exists()) {
                    throw new RuntimeException("Directory '${protoDir}' does not exist")
                }
                if (!protoFilePath.exists()) {
                    throw new RuntimeException("File '${protoFilePath}' does not exist")
                }
                mkdir "${bobDir}/generated"
                if (!hostPlatform) {
                    throw new RuntimeException("hostPlatform is not set. Make sure 'getHostPlatform' task is executed.")
                }
                commandLine "${dynamoHome}/ext/bin/${hostPlatform}/protoc", "--java_out=${bobDir}/generated",
                        "-I${protoDir}", "-I${dynamoHome}/ext/include", "-I../../engine/gameobject/proto",
                        "-I../../engine/script/src", "-I../../engine/ddf/src", "-I../../engine/graphics/proto", "${protoFilePath}"
            }
        }
    }
}

tasks.register('execProtoTasks') {
    dependsOn 'prepareBobBuildContext'
    dependsOn project.protoFiles.collect { proto ->
        "protoTask_${proto.file.replace('/', '_').replace('.', '_')}"
    }
}

tasks.register('proto', Exec) {
    group = 'build'
    def protoDir = project.findProperty('protoDir') ?: ''
    def protoFile = project.findProperty('protoFile') ?: ''
    inputs.file("${protoDir}/${protoFile}")
    outputs.dir("${bobDir}/generated")
    doFirst {
        if (!protoDir || !protoFile) {
            throw new RuntimeException("Properties 'protoDir' and 'protoFile' must be specified")
        }
        mkdir "${bobDir}/generated"
        if (!hostPlatform) {
            throw new RuntimeException("hostPlatform is not set. Make sure 'getHostPlatform' task is executed.")
        }
        commandLine "${dynamoHome}/ext/bin/${hostPlatform}/protoc", "--java_out=${bobDir}/generated",
                "-I${protoDir}", "-I${dynamoHome}/ext/include", "-I../../engine/gameobject/proto",
                "-I../../engine/script/src", "-I../../engine/ddf/src", "-I../../engine/graphics/proto", "${protoDir}/${protoFile}"
    }
}

sourceSets {
    main {
        java {
            srcDirs = ["${bobDir}/src",
                       "${bobDir}/generated"]
        }
    }
}

def bobGitRevision = "git -C ${bobDir} log --pretty=%H -n1".execute().text.trim()
def privateBobPluginModules = []
def targetPlatform = (project.findProperty('target-platform') ?: '').toString()
def privatePlatformRoot = ''
def platformsConfigFile = file("${bobDir}/../../.defold-platforms")
if (targetPlatform && platformsConfigFile.exists()) {
    def platformsConfig = new JsonSlurper().parse(platformsConfigFile)
    def platformConfig = platformsConfig[targetPlatform]
    if (platformConfig instanceof Map) {
        if (platformConfig.root) {
            def root = platformConfig.root.toString()
            privatePlatformRoot = file(root).canonicalPath
            def crDir = file("${root}/com.dynamo.cr")
            if (crDir.isDirectory()) {
                crDir.eachDirMatch(~/com\.dynamo\.cr\..+/) { moduleDir ->
                    if (moduleDir.name != 'com.dynamo.cr.bob' && moduleDir.name != 'com.dynamo.cr.bob.test') {
                        def sourceDir = file("${moduleDir}/src")
                        def buildFile = file("${moduleDir}/build.gradle")
                        if (sourceDir.isDirectory() && buildFile.exists()) {
                            def matcher = buildFile.getText('UTF-8') =~ /archiveFileName\s*=\s*['"]([^'"]+\.jar)['"]/
                            if (matcher.find()) {
                                privateBobPluginModules << [
                                        name: moduleDir.name,
                                        sourceDir: sourceDir,
                                        jarName: matcher.group(1)
                                ]
                            }
                        }
                    }
                }
            }
        }
    }
}

def privateBobPluginClassPath = privateBobPluginModules.collect { "plugins/${it.jarName}" }.join(' ')
def privateBobPluginJarTasks = []

ext.bobArtifactSettings = [bobDir: bobDir, dynamoHome: dynamoHome, revision: bobGitRevision,
                          privateRoot: privatePlatformRoot, engineJarNames: bobLightDependencyJars]
apply from: '../com.dynamo.cr.bob/artifacts.gradle'
def bobArtifacts = project.bobArtifacts
def bobLibraryJars = fileTree("${bobDir}/lib") {
    include '*.jar'
    exclude bobLightDependencyJars + ['android.jar']
}
def bobDependencyJars = files(bobLibraryJars, bobArtifacts.engineJars.values())
def bobAwsJars = fileTree("${bobDir}/lib/aws") { include '*.jar' }

dependencies {
    implementation bobDependencyJars
    implementation bobAwsJars
    implementation files("${dynamoHome}/ext/share/java/android.jar")
}

def artifactFiles = {
    Map<String, File> result = [:]
    bobArtifacts.entries.each { path, artifact ->
        if (artifact.source.isFile()) {
            result[path] = artifact.source
        }
    }
    bobArtifacts.privateFiles.files.sort().each { source ->
        def path = bobDir.toPath().relativize(source.toPath()).toString().replace(File.separatorChar, '/' as char)
        if (!result.containsKey(path)) {
            result[path] = source
        }
    }
    result
}

def validateArtifacts = { boolean light ->
    def missing = bobArtifacts.entries.findAll { path, artifact ->
        def required = light ? path.startsWith('libexec/') && path.contains('/luajit-64') : artifact.required
        required && !artifact.source.isFile()
    }
    if (!missing.isEmpty()) {
        throw new GradleException("Missing Bob artifacts; install the external packages and build or sync the engine: " +
                missing.collect { path, artifact -> "${path}: ${artifact.source}" }.join(', '))
    }
}

def readGitRevision = { String repositoryRoot ->
    if (!repositoryRoot) {
        return ''
    }
    try {
        def stdout = new ByteArrayOutputStream()
        def result = services.get(ExecOperations).exec {
            commandLine 'git', '-C', repositoryRoot, 'rev-parse', 'HEAD'
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        return result.exitValue == 0 ? stdout.toString('UTF-8').trim() : 'unversioned'
    } catch (Exception ignored) {
        return 'unversioned'
    }
}

def bobBuildContext = [
        "bobRevision=${bobGitRevision}",
        "targetPlatform=${targetPlatform}",
        "dynamoHome=${file(dynamoHome).canonicalPath}",
        "privateRoot=${privatePlatformRoot}",
        "privateRevision=${readGitRevision(privatePlatformRoot)}",
        "privatePlugins=${privateBobPluginModules.collect { "${it.name}:${it.jarName}" }.sort().join(',')}"
].join('\n') + '\n'
def bobBuildContextFile = file("${bobDir}/build/bob-build-context.txt")

tasks.register('prepareBobBuildContext') {
    inputs.property('buildContext', bobBuildContext)
    outputs.file(bobBuildContextFile)

    doLast {
        def previousContext = bobBuildContextFile.exists() ? bobBuildContextFile.getText('UTF-8') : ''
        if (previousContext != bobBuildContext) {
            logger.lifecycle("Bob build context changed; invalidating shared generated output")
            delete classesDir,
                    file("${bobDir}/generated"),
                    file("${bobDir}/dist"),
                    file("${bobDir}/tmp"),
                    file("${bobDir}/target"),
                    file("${bobDir}/build/private_plugins"),
                    file("${bobDir}/lib/luajit-share.zip")
        }
        bobBuildContextFile.parentFile.mkdirs()
        bobBuildContextFile.setText(bobBuildContext, 'UTF-8')
    }
}

tasks.register('generateEngineVersion') {
    dependsOn 'prepareBobBuildContext'
    inputs.file("${bobDir}/engine_version_generator.py")
    inputs.file("../../VERSION")
    inputs.property("gitRevision", bobGitRevision)
    outputs.file("${bobDir}/src/com/dynamo/bob/archive/EngineVersion.java")

    doLast {
        services.get(ExecOperations).exec {
            workingDir bobDir
            commandLine python, "${bobDir}/engine_version_generator.py"
        }
    }
}

tasks.register('compileGenerated', JavaCompile) {
    dependsOn 'execProtoTasks', 'generateEngineVersion'
    source = fileTree("${bobDir}/generated")
    destinationDirectory = generatedClassesDir
    include '**/*.java'
    classpath = sourceSets.main.compileClasspath
    options.encoding = 'UTF-8'
    options.compilerArgs << '-g'
}

tasks.register('compileSrc', JavaCompile) {
    dependsOn 'compileGenerated', 'generateEngineVersion'
    source = fileTree("${bobDir}/src")
    destinationDirectory = classesDir
    include '**/*.java'
    exclude '**/XBoxBundler.java'
    exclude '**/XBoxShaderCompiler.java'
    classpath = files(generatedClassesDir) + sourceSets.main.compileClasspath
    options.encoding = 'UTF-8'
    options.compilerArgs << '-g'
}

privateBobPluginModules.each { module ->
    def taskSuffix = module.name.replaceAll(/[^A-Za-z0-9]/, '_')
    def pluginClassesDir = file("${bobDir}/build/private_plugins/${module.name}")

    def compileTask = tasks.register("compilePrivatePlugin_${taskSuffix}", JavaCompile) {
        dependsOn 'compileSrc', 'compileBobLight'
        source = fileTree(module.sourceDir)
        destinationDirectory = pluginClassesDir
        include '**/*.java'
        classpath = files(classesDir, generatedClassesDir) + sourceSets.main.compileClasspath
        options.encoding = 'UTF-8'
        options.compilerArgs << '-g'
        outputs.dir(pluginClassesDir)
    }

    def jarTask = tasks.register("createPrivatePluginJar_${taskSuffix}", Jar) {
        dependsOn compileTask
        archiveFileName = module.jarName
        destinationDirectory = file("${bobDir}/dist/plugins")
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from pluginClassesDir
        outputs.file("${bobDir}/dist/plugins/${module.jarName}")
    }

    privateBobPluginJarTasks << jarTask
}

tasks.register('installPrivatePluginJars') {
    dependsOn privateBobPluginJarTasks
    doLast {
        privateBobPluginModules.each { module ->
            copy {
                from "${bobDir}/dist/plugins/${module.jarName}"
                into "${dynamoHome}/share/java/plugins"
            }
        }
    }
}

tasks.register('installPrivatePlugins') {
    dependsOn 'installBobLight'
}

tasks.register('createLuaJitShareZip', Zip) {
    dependsOn 'prepareBobBuildContext'
    archiveFileName = 'luajit-share.zip'
    destinationDirectory = bobArtifacts.luaJitShareZip.parentFile
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from("${dynamoHome}/ext/share/luajit") {
        into 'luajit'
    }

    inputs.dir("${dynamoHome}/ext/share/luajit")
    outputs.file(bobArtifacts.luaJitShareZip)
}

def bobLightResourceRoot = file("${bobDir}/src")
def bobLightResourceFiles = fileTree(bobLightResourceRoot) {
    exclude '**/*.java'
}
tasks.register('compileBobLight') {
    dependsOn 'compileSrc', 'createLuaJitShareZip'
}

tasks.register('compile') {
    dependsOn 'compileBobLight'
}

tasks.register('createExternalLibsLightJar', Jar) {
    dependsOn 'compileSrc'
    archiveFileName = 'external-libs-light.jar'
    destinationDirectory = file("${bobDir}/tmp")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        bobDependencyJars.collect { zipTree(it) }
    }

    inputs.files(bobDependencyJars)
    outputs.file("${bobDir}/tmp/external-libs-light.jar")

    doLast {
        if (!file("${bobDir}/tmp/external-libs-light.jar").exists()) {
            throw new RuntimeException("File '${bobDir}/tmp/external-libs-light.jar' was not created")
        } else {
            println "external-libs-light.jar successfully created"
        }
    }
}

tasks.register('createBobLightJar', Jar) {
    dependsOn 'compileBobLight', 'createExternalLibsLightJar', 'createLuaJitShareZip'
    dependsOn privateBobPluginJarTasks

    archiveFileName = 'bob-light.jar'
    destinationDirectory = file("${bobDir}/dist")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(classesDir) {
        include '**/*.class'
        exclude 'private_plugins/**'
    }
    from generatedClassesDir
    from bobLightResourceFiles
    bobArtifacts.entries.findAll { path, artifact -> artifact.light }.each { path, artifact ->
        from({ artifact.source.isFile() ? artifact.source : [] }) {
            into path.substring(0, path.lastIndexOf('/'))
            rename { path.substring(path.lastIndexOf('/') + 1) }
        }
    }
    from bobArtifacts.privateLightFiles
    doFirst { validateArtifacts(true) }

    from {
        zipTree(file("${bobDir}/tmp/external-libs-light.jar"))
    } {
        exclude '**/META-INF/**'
    }

    outputs.file("${bobDir}/dist/bob-light.jar")

    manifest {
        def attrs = [
                'Main-Class': 'com.dynamo.bob.Bob',
                'Enable-Native-Access': 'ALL-UNNAMED',
                'is-bob-light': 'true'
        ]
        if (privateBobPluginClassPath) {
            attrs['Class-Path'] = privateBobPluginClassPath
        }
        attributes attrs
    }

    doLast {
        def hostFontcLibraryNames = [
                'x86_64-macos': 'libfontc_shared.dylib',
                'arm64-macos': 'libfontc_shared.dylib',
                'x86_64-linux': 'libfontc_shared.so',
                'arm64-linux': 'libfontc_shared.so',
                'x86_64-win32': 'fontc_shared.dll'
        ]
        def hostFontcLibraryName = hostFontcLibraryNames[hostPlatform]
        if (!hostFontcLibraryName) {
            throw new GradleException("Unsupported host platform: ${hostPlatform}")
        }
        def hostFontcPath = "lib/${hostPlatform}/${hostFontcLibraryName}"
        def hasHostFontc = false
        new ZipFile(archiveFile.get().asFile).withCloseable { zipFile ->
            hasHostFontc = zipFile.getEntry(hostFontcPath) != null
        }
        if (!hasHostFontc) {
            throw new GradleException("bob-light.jar is missing the host font compiler library: ${hostFontcPath}")
        }
    }
}

tasks.register('distBobLight') {
    dependsOn 'compileBobLight', 'createBobLightJar'
}

tasks.register('createExternalLibsBuiltinsJar', Jar) {
    dependsOn 'compileSrc', 'compileGenerated'
    archiveFileName = 'external-libs-builtins.jar'
    destinationDirectory = file("${bobDir}/tmp")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    Set<File> jarFiles = new HashSet<>()

    jarFiles.addAll(bobAwsJars.files as Set<File>)

    jarFiles.addAll(bobDependencyJars.files as Set<File>)

