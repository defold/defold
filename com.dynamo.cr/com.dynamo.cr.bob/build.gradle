    doLast {
        def outputFile = file("${bobDir}/tmp/external-libs-builtins.jar")
        if (!outputFile.exists()) {
            throw new RuntimeException("File '${outputFile}' was not created")
        } else {
            println "external-libs-builtins.jar successfully created"
        }
    }
}

def createManifestBytes = { Map<String, String> attributes ->
    Manifest manifest = new Manifest()
    Attributes mainAttributes = manifest.mainAttributes
    mainAttributes.put(Attributes.Name.MANIFEST_VERSION, '1.0')
    attributes.each { key, value ->
        mainAttributes.put(new Attributes.Name(key.toString()), value.toString())
    }

    ByteArrayOutputStream outputStream = new ByteArrayOutputStream()
    manifest.write(outputStream)
    return outputStream.toByteArray()
}

def isMetaInfPath = { String path ->
    return path.startsWith('META-INF/') || path.contains('/META-INF/')
}

def calculateCrcAndSize = { Closure<InputStream> openStream ->
    CRC32 crc = new CRC32()
    long size = 0
    byte[] buffer = new byte[64 * 1024]
    openStream.call().withCloseable { InputStream inputStream ->
        int read
        while ((read = inputStream.read(buffer)) != -1) {
            crc.update(buffer, 0, read)
            size += read
        }
    }
    return [crc: crc.value, size: size]
}

def writeArchiveEntry = { ZipArchiveOutputStream zipOutputStream, String path, byte[] bytes, int method ->
    ZipArchiveEntry entry = new ZipArchiveEntry(path)
    entry.setTime(0L)
    entry.setMethod(method)
    entry.setSize(bytes.length)
    if (method == ZipArchiveOutputStream.STORED) {
        CRC32 crc = new CRC32()
        crc.update(bytes, 0, bytes.length)
        entry.setCompressedSize(bytes.length)
        entry.setCrc(crc.value)
    }

    zipOutputStream.putArchiveEntry(entry)
    zipOutputStream.write(bytes)
    zipOutputStream.closeArchiveEntry()
}

def collectParentDirectories = { Set<String> directoryPaths, String path ->
    path = path.replace(File.separatorChar, '/' as char)
    int separatorIndex = path.lastIndexOf('/')
    while (separatorIndex > 0) {
        directoryPaths.add(path.substring(0, separatorIndex + 1))
        separatorIndex = path.lastIndexOf('/', separatorIndex - 1)
    }
}

def addParallelArchiveEntry = { ParallelScatterZipCreator creator, Set<String> seenPaths, String path, Closure<InputStream> openStream, Long knownSize, int method ->
    path = path.replace(File.separatorChar, '/' as char)
    if (path.length() == 0 || path.endsWith('/') || !seenPaths.add(path)) {
        return
    }

    ZipArchiveEntry entry = new ZipArchiveEntry(path)
    entry.setTime(0L)
    entry.setMethod(method)
    if (knownSize != null && knownSize >= 0) {
        entry.setSize(knownSize)
    }
    if (method == ZipArchiveOutputStream.STORED) {
        def crcAndSize = calculateCrcAndSize(openStream)
        entry.setSize(crcAndSize.size)
        entry.setCompressedSize(crcAndSize.size)
        entry.setCrc(crcAndSize.crc)
    }

    creator.addArchiveEntry(entry, { openStream.call() } as InputStreamSupplier)
}

tasks.register('createBobJar') {
    dependsOn 'compileBobLight', 'createExternalLibsBuiltinsJar', 'createLuaJitShareZip'
    dependsOn privateBobPluginJarTasks

    def outputFile = file("${bobDir}/dist/bob.jar")
    def bobClassesFileTree = fileTree(classesDir) {
        include '**/*.class'
        exclude 'private_plugins/**'
    }
    def bobGeneratedClassesFileTree = fileTree(generatedClassesDir)

    inputs.files(bobClassesFileTree, bobGeneratedClassesFileTree).ignoreEmptyDirectories()
    inputs.files(bobLightResourceFiles).ignoreEmptyDirectories()
    inputs.files { artifactFiles().values() }
    inputs.property('artifactPaths', { artifactFiles().keySet().sort() })
    inputs.file("${bobDir}/tmp/external-libs-builtins.jar")
    inputs.file(bobArtifacts.builtinsZip)
    inputs.property('keep-bob-uncompressed', keepBobUncompressed)
    inputs.property('gradle-version', gradleVersion)
    inputs.property('created-by', "${System.getProperty('java.version')} (${System.getProperty('java.vendor')})")
    inputs.property('private-bob-plugin-class-path', privateBobPluginClassPath)
    outputs.file(outputFile)

    doLast {
        validateArtifacts(false)
        int compressionMethod = keepBobUncompressed ? ZipArchiveOutputStream.STORED : ZipArchiveOutputStream.DEFLATED
        int threadCount = Math.max(2, Runtime.getRuntime().availableProcessors())
        def executor = Executors.newFixedThreadPool(threadCount)
        def creator = new ParallelScatterZipCreator(executor)
        Set<String> seenPaths = new LinkedHashSet<>()
        Set<String> directoryPaths = new TreeSet<>()
        List<ZipFile> zipFiles = []

        def addFile = { String path, File sourceFile ->
            if (!sourceFile.isFile()) {
                return
            }
            if (path.startsWith("tmp${File.separator}") || path == 'tmp') {
                return
            }
            collectParentDirectories(directoryPaths, path)
            addParallelArchiveEntry(creator, seenPaths, path, { new BufferedInputStream(new FileInputStream(sourceFile)) }, sourceFile.length(), compressionMethod)
        }

        def addZipEntries = { File zipPath, boolean excludeMetaInf ->
            ZipFile zipFile = new ZipFile(zipPath)
            zipFiles.add(zipFile)
            zipFile.entries().toList().each { zipEntry ->
                def currentEntry = zipEntry
                if (currentEntry.directory || (excludeMetaInf && isMetaInfPath(currentEntry.name))) {
                    return
                }
                collectParentDirectories(directoryPaths, currentEntry.name)
                addParallelArchiveEntry(creator, seenPaths, currentEntry.name, { zipFile.getInputStream(currentEntry) }, currentEntry.size, compressionMethod)
            }
        }

        try {
            mkdir outputFile.parentFile
            delete outputFile

            seenPaths.add('META-INF/MANIFEST.MF')
            bobClassesFileTree.files.sort { sourceFile ->
                classesDir.toPath().relativize(sourceFile.toPath()).toString()
            }.each { sourceFile ->
                addFile(classesDir.toPath().relativize(sourceFile.toPath()).toString(), sourceFile)
            }
            bobGeneratedClassesFileTree.files.sort { sourceFile ->
                generatedClassesDir.toPath().relativize(sourceFile.toPath()).toString()
            }.each { sourceFile ->
                addFile(generatedClassesDir.toPath().relativize(sourceFile.toPath()).toString(), sourceFile)
            }
            bobLightResourceFiles.files.sort().each { sourceFile ->
                addFile(bobLightResourceRoot.toPath().relativize(sourceFile.toPath()).toString(), sourceFile)
            }
            artifactFiles().sort().each { path, sourceFile ->
                addFile(path, sourceFile)
            }
            addZipEntries(file("${bobDir}/tmp/external-libs-builtins.jar"), true)
            addZipEntries(bobArtifacts.builtinsZip, false)

            ZipArchiveOutputStream zipOutputStream = new ZipArchiveOutputStream(outputFile)
            try {
                zipOutputStream.setUseZip64(Zip64Mode.AsNeeded)
                zipOutputStream.setMethod(compressionMethod)
                def manifestAttributes = [
                        'Main-Class': 'com.dynamo.bob.Bob',
                        'Enable-Native-Access': 'ALL-UNNAMED',
                        'Gradle-Version': gradleVersion,
                        'Created-By': "${System.getProperty('java.version')} (${System.getProperty('java.vendor')})"
                ]
                if (privateBobPluginClassPath) {
                    manifestAttributes['Class-Path'] = privateBobPluginClassPath
                }
                writeArchiveEntry(zipOutputStream, 'META-INF/MANIFEST.MF', createManifestBytes(manifestAttributes), compressionMethod)
                directoryPaths.each { directoryPath ->
                    writeArchiveEntry(zipOutputStream, directoryPath, new byte[0], compressionMethod)
                }
                creator.writeTo(zipOutputStream)
            } finally {
                zipOutputStream.close()
            }
        } finally {
            zipFiles.each { zipFile -> zipFile.close() }
            executor.shutdown()
            if (!executor.awaitTermination(1, TimeUnit.MINUTES)) {
                executor.shutdownNow()
            }
        }

        if (!outputFile.exists()) {
            throw new RuntimeException("File '${outputFile}' was not created")
        } else {
            println "bob.jar successfully created with ParallelScatterZipCreator (${threadCount} threads)"
        }
    }
}

tasks.register('distBob') {
    dependsOn 'compile', 'createBobJar'
    doLast {
        mkdir "${bobDir}/dist"
        mkdir "${bobDir}/tmp"
    }
}

tasks.register('installBobLight') {
    dependsOn 'distBobLight'
    finalizedBy 'installPrivatePluginJars'
    doLast {
        def sourceFile = file("${bobDir}/dist/bob-light.jar")
        def destinationDir = file("${dynamoHome}/share/java")
        def destinationFile = file("${destinationDir}/bob-light.jar")
        def temporaryFile = file("${destinationDir}/bob-light.jar.${System.nanoTime()}.tmp")

        if (!sourceFile.exists()) {
            throw new RuntimeException("File '${sourceFile}' does not exist")
        }

        destinationDir.mkdirs()
        if (destinationFile.exists()
                && Files.mismatch(sourceFile.toPath(), destinationFile.toPath()) == -1L) {
            return
        }

        Files.copy(sourceFile.toPath(), temporaryFile.toPath(), StandardCopyOption.REPLACE_EXISTING)
        try {
            Files.move(temporaryFile.toPath(), destinationFile.toPath(),
                    StandardCopyOption.REPLACE_EXISTING,
                    StandardCopyOption.ATOMIC_MOVE)
        } catch (AtomicMoveNotSupportedException ignored) {
            Files.move(temporaryFile.toPath(), destinationFile.toPath(),
                    StandardCopyOption.REPLACE_EXISTING)
        } finally {
            temporaryFile.delete()
        }
    }
}

tasks.register('install') {
    dependsOn 'distBob'
    finalizedBy 'installPrivatePluginJars'
    doLast {
        copy {
            from "${bobDir}/dist/bob.jar"
            into "${dynamoHome}/share/java"
        }
    }
}
