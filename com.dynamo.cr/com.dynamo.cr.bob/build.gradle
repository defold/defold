def createManifestBytes = { Map<String, String> attributes ->
    Manifest manifest = new Manifest()
    Attributes mainAttributes = manifest.mainAttributes
    mainAttributes.put(Attributes.Name.MANIFEST_VERSION, '1.0')
    attributes.each { key, value ->
        mainAttributes.put(new Attributes.Name(key.toString()), value.toString())
    }

    ByteArrayOutputStream outputStream = new ByteArrayOutputStream()
    manifest.write(outputStream)
    return outputStream.toByteArray()
}

def isMetaInfPath = { String path ->
    return path.startsWith('META-INF/') || path.contains('/META-INF/')
}

def createArchiveEntry = { String path, int method, boolean light ->
    ZipArchiveEntry entry = new ZipArchiveEntry(path)
    if (light) {
        // Match Gradle Jar's reproducible timestamps and default permissions.
        entry.setTimeLocal(LocalDateTime.of(1980, 2, 1, 0, 0))
        entry.setUnixMode(path.endsWith('/') ? 040755 : 0100644)
    } else {
        entry.setTime(0L)
    }
    entry.setMethod(method)
    entry
}

def writeArchiveEntry = { ZipArchiveOutputStream zipOutputStream, String path, byte[] bytes, int method, boolean light ->
    ZipArchiveEntry entry = createArchiveEntry(path, method, light)
    entry.setSize(bytes.length)
    if (method == ZipArchiveOutputStream.STORED) {
        CRC32 crc = new CRC32()
        crc.update(bytes, 0, bytes.length)
        entry.setCompressedSize(bytes.length)
        entry.setCrc(crc.value)
    }

    zipOutputStream.putArchiveEntry(entry)
    zipOutputStream.write(bytes)
    zipOutputStream.closeArchiveEntry()
}

def collectParentDirectories = { Set<String> directoryPaths, String path ->
    path = path.replace(File.separatorChar, '/' as char)
    int separatorIndex = path.lastIndexOf('/')
    while (separatorIndex > 0) {
        directoryPaths.add(path.substring(0, separatorIndex + 1))
        separatorIndex = path.lastIndexOf('/', separatorIndex - 1)
    }
}

def addParallelArchiveEntry = { ParallelScatterZipCreator creator, String path, Closure<InputStream> openStream, Long knownSize, int method, boolean light ->
    ZipArchiveEntry entry = createArchiveEntry(path, method, light)
    if (knownSize != null && knownSize >= 0) {
        entry.setSize(knownSize)
    }
    // ScatterZipOutputStream calculates size and CRC while reading.
    creator.addArchiveEntry(entry, { openStream.call() } as InputStreamSupplier)
}

def dependencyExcludes = (DirectoryScanner.getDefaultExcludes().toList() + ['tmp/**', 'reports/**']).collect {
    it.replace('/' as char, File.separatorChar)
}
def bobClassesFileTree = fileTree(classesDir) {
    include '**/*.class'
    exclude 'private_plugins/**'
}
def bobGeneratedClassesFileTree = fileTree(generatedClassesDir)

def writeBobArchive = { File outputFile, Collection<File> dependencyJars, Map<String, String> manifestAttributes, boolean light ->
    validateArtifacts(light)
    int compressionMethod = keepBobUncompressed ? ZipArchiveOutputStream.STORED : ZipArchiveOutputStream.DEFLATED
    int threadCount = Math.max(2, Runtime.getRuntime().availableProcessors())
    def executor = keepBobUncompressed ? null : Executors.newFixedThreadPool(threadCount)
    def creator = executor == null ? null : new ParallelScatterZipCreator(executor)
    Set<String> seenPaths = new LinkedHashSet<>()
    Set<String> directoryPaths = new TreeSet<>()
    List<RawZipFile> zipFiles = []
    def zipEntries = []
    def storedFiles = [:]

    def addFile = { String path, File sourceFile ->
        if (!sourceFile.isFile()) {
            return
        }
        path = path.replace(File.separatorChar, '/' as char)
        if (path.startsWith('tmp/') || path == 'tmp' ||
                (light && (path.startsWith('reports/') || path == 'reports'))) {
            return
        }
        if (!seenPaths.add(path)) {
            return
        }
        collectParentDirectories(directoryPaths, path)
        if (keepBobUncompressed) {
            storedFiles[path] = sourceFile
        } else {
            addParallelArchiveEntry(creator, path, { new BufferedInputStream(new FileInputStream(sourceFile)) }, sourceFile.length(), compressionMethod, light)
        }
    }

    def addZipEntries = { File zipPath, boolean dependencyJar ->
        RawZipFile zipFile = RawZipFile.builder().setFile(zipPath).get()
        zipFiles.add(zipFile)
        // Preserve the former readers' last payload for repeated names within a ZIP.
        Map<String, ZipArchiveEntry> entriesByName = [:]
        zipFile.entries.each { zipEntry -> entriesByName[zipEntry.name] = zipEntry }
        entriesByName.values().each { zipEntry ->
            if (zipEntry.directory) {
                return
            }
            // Retain zipTree's default exclusions and the former Jar task's filters.
            if (dependencyJar) {
                String entryPath = zipEntry.name.replace('/' as char, File.separatorChar)
                if (isMetaInfPath(zipEntry.name) || dependencyExcludes.any { SelectorUtils.matchPath(it, entryPath) }) {
                    return
                }
            }
            String path = zipEntry.name.replace(File.separatorChar, '/' as char)
            if (path.length() == 0 || !seenPaths.add(path)) {
                return
            }
            collectParentDirectories(directoryPaths, path)
            zipEntries.add([zipFile: zipFile, entry: zipEntry, path: path])
        }
    }

    try {
        mkdir outputFile.parentFile
        delete outputFile

        seenPaths.add('META-INF/MANIFEST.MF')
        if (light) {
            directoryPaths.add('META-INF/')
        }
        bobClassesFileTree.files.sort { sourceFile ->
            classesDir.toPath().relativize(sourceFile.toPath()).toString()
        }.each { sourceFile ->
            addFile(classesDir.toPath().relativize(sourceFile.toPath()).toString(), sourceFile)
        }
        bobGeneratedClassesFileTree.files.sort { sourceFile ->
            generatedClassesDir.toPath().relativize(sourceFile.toPath()).toString()
        }.each { sourceFile ->
            addFile(generatedClassesDir.toPath().relativize(sourceFile.toPath()).toString(), sourceFile)
        }
        bobLightResourceFiles.files.sort().each { sourceFile ->
            addFile(bobLightResourceRoot.toPath().relativize(sourceFile.toPath()).toString(), sourceFile)
        }
        artifactFiles(light).sort().each { path, sourceFile ->
            addFile(path, sourceFile)
        }
        dependencyJars.each { dependencyJar ->
            addZipEntries(dependencyJar, true)
        }
        if (!light) {
            addZipEntries(bobArtifacts.builtinsZip, false)
        }

        ZipArchiveOutputStream zipOutputStream = new ZipArchiveOutputStream(outputFile)
        try {
            zipOutputStream.setUseZip64(Zip64Mode.AsNeeded)
            zipOutputStream.setMethod(compressionMethod)
            writeArchiveEntry(zipOutputStream, 'META-INF/MANIFEST.MF', createManifestBytes(manifestAttributes), compressionMethod, light)
            directoryPaths.each { directoryPath ->
                writeArchiveEntry(zipOutputStream, directoryPath, new byte[0], compressionMethod, light)
            }
            if (keepBobUncompressed) {
                // The seekable output fills in CRC without a pre-read or scatter files.
                storedFiles.each { path, sourceFile ->
                    ZipArchiveEntry entry = createArchiveEntry(path, compressionMethod, light)
                    entry.setSize(sourceFile.length())
                    entry.setCompressedSize(sourceFile.length())
                    zipOutputStream.putArchiveEntry(entry)
                    sourceFile.withInputStream { inputStream -> inputStream.transferTo(zipOutputStream) }
                    zipOutputStream.closeArchiveEntry()
                }
            } else {
                creator.writeTo(zipOutputStream)
            }
            zipEntries.each { source ->
                ZipArchiveEntry entry = createArchiveEntry(source.path, compressionMethod, light)
                entry.setSize(source.entry.size)
                entry.setCrc(source.entry.crc)
                if (source.entry.method == compressionMethod) {
                    // Keep the compressed payload and CRC; only rewrite the ZIP headers.
                    entry.setCompressedSize(source.entry.compressedSize)
                    source.zipFile.getRawInputStream(source.entry).withCloseable { inputStream ->
                        zipOutputStream.addRawArchiveEntry(entry, inputStream)
                    }
                } else {
                    // Honor keep-bob-uncompressed even when the dependency is deflated.
                    if (compressionMethod == ZipArchiveOutputStream.STORED) {
                        entry.setCompressedSize(source.entry.size)
                    }
                    zipOutputStream.putArchiveEntry(entry)
                    source.zipFile.getInputStream(source.entry).withCloseable { inputStream ->
                        inputStream.transferTo(zipOutputStream)
                    }
                    zipOutputStream.closeArchiveEntry()
                }
            }
        } finally {
            zipOutputStream.close()
        }
    } finally {
        if (executor != null) {
            executor.shutdown()
            if (!executor.awaitTermination(1, TimeUnit.MINUTES)) {
                executor.shutdownNow()
            }
        }
        zipFiles.each { zipFile -> zipFile.close() }
    }

    if (!outputFile.exists()) {
        throw new RuntimeException("File '${outputFile}' was not created")
    } else {
        println "${outputFile.name} successfully created with raw dependency entries" +
                (keepBobUncompressed ? ' (uncompressed)' : " and parallel compression (${threadCount} threads)")
    }
}

[createBobJar: false, createBobLightJar: true].each { taskName, light ->
    tasks.register(taskName) {
        dependsOn 'compileBobLight', 'createLuaJitShareZip'
        dependsOn privateBobPluginJarTasks

        // Keep each former packager's dependency order and duplicate precedence.
        Collection<File> dependencyJars
        if (light) {
            dependencyJars = bobDependencyJars.files.toList()
        } else {
            dependencyJars = new HashSet<>()
            dependencyJars.addAll(bobAwsJars.files)
            dependencyJars.addAll(bobDependencyJars.files)
        }
        def outputFile = file("${bobDir}/dist/${light ? 'bob-light' : 'bob'}.jar")
        def manifestAttributes = [
                'Main-Class': 'com.dynamo.bob.Bob',
                'Enable-Native-Access': 'ALL-UNNAMED'
        ]
        if (light) {
            manifestAttributes['is-bob-light'] = 'true'
        } else {
            manifestAttributes['Gradle-Version'] = gradleVersion
            manifestAttributes['Created-By'] = "${System.getProperty('java.version')} (${System.getProperty('java.vendor')})"
        }
        if (privateBobPluginClassPath) {
            manifestAttributes['Class-Path'] = privateBobPluginClassPath
        }

        inputs.files(bobClassesFileTree, bobGeneratedClassesFileTree).ignoreEmptyDirectories()
        inputs.files(bobLightResourceFiles).ignoreEmptyDirectories()
        inputs.files { artifactFiles(light).values() }
        inputs.property('artifactPaths', { artifactFiles(light).keySet().sort() })
        inputs.files(dependencyJars)
        inputs.property('dependencyExcludes', dependencyExcludes)
        if (!light) {
            inputs.file(bobArtifacts.builtinsZip)
        }
        inputs.property('keep-bob-uncompressed', keepBobUncompressed)
        inputs.property('gradle-version', gradleVersion)
        inputs.property('manifestAttributes', manifestAttributes)
        outputs.file(outputFile)

        doLast {
            writeBobArchive(outputFile, dependencyJars, manifestAttributes, light)
            if (light) {
                def hostFontcPath = bobArtifacts.entries.keySet().find { path ->
                    path.startsWith("lib/${hostPlatform}/") && path.contains('fontc_shared')
                }
                if (!hostFontcPath) {
                    throw new GradleException("Unsupported host platform: ${hostPlatform}")
                }
                new ZipFile(outputFile).withCloseable { zipFile ->
                    if (zipFile.getEntry(hostFontcPath) == null) {
                        throw new GradleException("bob-light.jar is missing the host font compiler library: ${hostFontcPath}")
                    }
                }
            }
        }
    }
}

tasks.register('distBob') {
    dependsOn 'compile', 'createBobJar'
    doLast {
        mkdir "${bobDir}/dist"
        mkdir "${bobDir}/tmp"
    }
}

tasks.register('installBobLight') {
    dependsOn 'distBobLight'
    finalizedBy 'installPrivatePluginJars'
    doLast {
        def sourceFile = file("${bobDir}/dist/bob-light.jar")
        def destinationDir = file("${dynamoHome}/share/java")
        def destinationFile = file("${destinationDir}/bob-light.jar")
        def temporaryFile = file("${destinationDir}/bob-light.jar.${System.nanoTime()}.tmp")

        if (!sourceFile.exists()) {
            throw new RuntimeException("File '${sourceFile}' does not exist")
        }

        destinationDir.mkdirs()
        if (destinationFile.exists()
                && Files.mismatch(sourceFile.toPath(), destinationFile.toPath()) == -1L) {
            return
        }

        Files.copy(sourceFile.toPath(), temporaryFile.toPath(), StandardCopyOption.REPLACE_EXISTING)
        try {
            Files.move(temporaryFile.toPath(), destinationFile.toPath(),
                    StandardCopyOption.REPLACE_EXISTING,
                    StandardCopyOption.ATOMIC_MOVE)
        } catch (AtomicMoveNotSupportedException ignored) {
            Files.move(temporaryFile.toPath(), destinationFile.toPath(),
                    StandardCopyOption.REPLACE_EXISTING)
        } finally {
            temporaryFile.delete()
        }
    }
}

tasks.register('install') {
    dependsOn 'distBob'
    finalizedBy 'installPrivatePluginJars'
    doLast {
        copy {
            from "${bobDir}/dist/bob.jar"
            into "${dynamoHome}/share/java"
        }
    }
}
