// Resolve installed artifacts to their paths inside Bob without staging copies.
def settings = project.bobArtifactSettings
def bobDir = settings.bobDir
def dynamoHome = settings.dynamoHome
def archiveDir = new File(dynamoHome, "archive/${settings.revision}/engine")
def useArchive = archiveDir.parentFile.isDirectory()
def desktopPlatforms = ['x86_64-macos', 'arm64-macos', 'x86_64-linux', 'arm64-linux', 'x86_64-win32']
def macPlatforms = ['x86_64-macos', 'arm64-macos']
def androidToolPlatforms = desktopPlatforms - 'arm64-linux'

def libraryName = { String platform, String name ->
    platform.endsWith('win32') ? "${name}.dll" : "lib${name}.${platform.endsWith('macos') ? 'dylib' : 'so'}"
}
def preferLocal = { String localPath, String archivePath ->
    def localFile = new File(dynamoHome, localPath)
    localFile.isFile() || !useArchive ? localFile : new File(archiveDir, archivePath)
}
def entries = [:]
Set<String> managedPaths = []
def add = { String path, File source, boolean light = false, boolean required = false ->
    entries[path] = [source: source, light: light, required: required]
}

desktopPlatforms.each { platform ->
    def exe = platform.endsWith('win32') ? '.exe' : ''
    ['glslang', 'tint', 'gltf_validator', 'spirv-opt', 'luajit-64', 'lipo'].each { tool ->
        def name = "${tool}${exe}"
        add("libexec/${platform}/${name}", new File(dynamoHome, "ext/bin/${platform}/${name}"), tool != 'lipo', true)
    }
    ['texc', 'modelc', 'shaderc', 'fontc'].each { library ->
        def name = libraryName(platform, "${library}_shared")
        // Match the existing preference for fresh local compiler libraries.
        add("lib/${platform}/${name}", preferLocal("lib/${platform}/${name}", "${platform}/${name}"), true, useArchive)
    }
}
androidToolPlatforms.each { platform ->
    def exe = platform.endsWith('win32') ? '.exe' : ''
    ['aapt2', 'oggz-validate', 'strip_android', 'zipalign'].each { tool ->
        def name = "${tool}${exe}"
        add("libexec/${platform}/${name}", new File(dynamoHome, "ext/bin/${platform}/${name}"), tool == 'aapt2', true)
    }
    ['ogg', 'oggz'].each { library ->
        // The Windows Ogg packages use a lib prefix too.
        def name = platform.endsWith('win32') ? "lib${library}.dll" : libraryName(platform, library)
        add("libexec/${platform}/${name}", new File(dynamoHome, "ext/lib/${platform}/${name}"), false, true)
    }
}
macPlatforms.each { platform ->
    ['codesign_allocate', 'strip'].each { tool ->
        add("libexec/${platform}/${tool}", new File(dynamoHome, "ext/bin/${platform}/${tool}"), false, true)
    }
}
['x86_64-linux': ['apkc', 'libc++.so.1'], 'x86_64-win32': ['libwinpthread-1.dll']].each { platform, names ->
    names.each { name ->
        add("libexec/${platform}/${name}", new File(dynamoHome, "ext/bin/${platform}/${name}"), false, true)
    }
}
add('libexec/bundletool-all.jar', new File(dynamoHome, 'ext/share/java/bundletool-all.jar'), false, true)
add('lib/android.jar', new File(dynamoHome, 'ext/share/java/android.jar'), false, true)
['armv7-android', 'arm64-android', 'x86_64-android'].each { platform ->
    add("libexec/${platform}/libvkquality.so", new File(dynamoHome, "ext/lib/${platform}/libvkquality.so"), false, true)
}
add('lib/vkquality/vkqualitydata.vkq', new File(dynamoHome, 'ext/share/vkquality/assets/vkqualitydata.vkq'), false, true)

def builtinsZip = new File(useArchive ? archiveDir : dynamoHome, 'share/builtins.zip')
def luaJitShareZip = new File(bobDir, 'tmp/luajit-share.zip')
add('lib/builtins.zip', builtinsZip, false, true)
add('lib/luajit-share.zip', luaJitShareZip, true, true)
add('lib/classes.dex', new File(useArchive ? archiveDir : dynamoHome,
        useArchive ? 'arm64-android/classes.dex' : 'share/java/classes.dex'), false, useArchive)
['lib/report_template.html', 'lib/time_report_template.html', 'lib/x86_64-linux/libc++.so'].each { path ->
    add(path, new File(bobDir, path))
}

def archivedEnginePlatforms = ['x86_64-linux', 'x86_64-macos', 'arm64-macos', 'x86_64-win32', 'arm64-ios', 'arm64-android', 'wasm-web']
def enginePlatforms = desktopPlatforms + ['arm64-ios', 'arm64_sim-ios', 'armv7-android', 'arm64-android', 'x86_64-android', 'wasm-web', 'wasm_pthread-web']
enginePlatforms.each { platform ->
    ['dmengine', 'dmengine_release'].each { engine ->
        def names = platform.endsWith('win32') ? ["${engine}.exe"] :
                platform.endsWith('android') ? ["lib${engine}.so"] :
                platform.endsWith('web') ? ["${engine}.js", "${engine}.wasm"] : [engine]
        names.each { name ->
            def path = "libexec/${platform}/${name}".toString()
            managedPaths.add(path)
            if (!useArchive || platform in archivedEnginePlatforms) {
                def stripped = useArchive && !platform.endsWith('win32') && !platform.endsWith('web') ? 'stripped/' : ''
                def source = useArchive ? new File(archiveDir, "${platform}/${stripped}${name}") : new File(dynamoHome, "bin/${platform}/${name}")
                add(path, source, false, useArchive)
            }
        }
    }
}
managedPaths.addAll(entries.keySet())

// Local Switch builds used the same fallback as public engines. Archive builds
// obtain these through copy_private.sh, so keep their staged paths available.
if (!useArchive) {
    ['dmengine', 'dmengine_release'].each { engine ->
        ['nss', 'nso'].each { extension ->
            def path = "arm64-nx64/${engine}.${extension}"
            add("libexec/${path}", new File(dynamoHome, "bin/${path}"))
        }
    }
}

// Retain private-platform additions, but never fall back to stale public copies.
def privateFiles = files()
if (settings.privateRoot || new File(bobDir, 'scripts/copy_private.sh').isFile()) {
    privateFiles = fileTree(bobDir) {
        include 'libexec/**', 'lib/**/*texc_shared*', 'lib/**/*modelc_shared*',
                'lib/**/*shaderc_shared*', 'lib/**/*fontc_shared*', 'lib/**/*libc++*', 'lib/*.zip'
        exclude '**/*dSYM.zip'
        exclude { element -> managedPaths.contains(element.relativePath.pathString) }
    }
}
def privateLightFiles = privateFiles.asFileTree.matching {
    include 'lib/**/*texc_shared*', 'lib/**/*modelc_shared*', 'lib/**/*shaderc_shared*',
            'lib/**/*fontc_shared*', 'libexec/**/glslang*', 'libexec/**/tint*',
            'libexec/**/gltf_validator*', 'libexec/**/spirv-opt*', 'libexec/**/luajit*', 'libexec/**/aapt2*'
}

def engineJars = settings.engineJarNames.collectEntries { name ->
    [(name): preferLocal("share/java/${name}", "share/java/${name}")]
}
ext.bobArtifacts = [entries: entries, privateFiles: privateFiles, privateLightFiles: privateLightFiles, engineJars: engineJars,
                    builtinsZip: builtinsZip, luaJitShareZip: luaJitShareZip]
